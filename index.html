<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Архивоведение — Telegram Mini App</title>
<meta name="theme-color" content="#ffffff">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ================== БАЗА / ТЕМЫ ================== */
:root{
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #111114);
  --hint: var(--tg-theme-hint-color, #85858b);
  --link: var(--tg-theme-link-color, #0a7cff);
  --btn: var(--tg-theme-button-color, #0a7cff);
  --btntxt: var(--tg-theme-button-text-color, #ffffff);
  --sec: var(--tg-theme-secondary-bg-color, #f1f2f6);
  --accent: #0a7cff;
  --ok: #2ea552;
  --amber: #e0900b;
  --fs: 17px;
  --r: 16px;
  --sep: rgba(120,120,128,.22);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  --maxw: 780px;
}
[data-scheme="dark"]{
  --sec:#0e0e10; --bg:#1b1c1f; --text:#f2f2f6; --hint:#9a9aa2; --link:#5aa9ff;
  --btn:#2f7cf6; --btntxt:#fff; --accent:#5aa9ff; --sep:rgba(255,255,255,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--sec); color:var(--text); font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));position:relative}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
mark{background:rgba(10,124,255,.18);color:inherit;border-radius:4px;padding:0 2px}

/* ================== ВЕРХНЯЯ ПАНЕЛЬ ================== */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bg);
  border-bottom:.5px solid var(--sep);
}
.topbar .t-title{flex:1;min-width:0;line-height:1.15}
.topbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11.5px;color:var(--hint);letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(120,120,128,.12);color:var(--link);transition:transform .12s ease;
}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg);border-bottom:.5px solid var(--sep);font-size:11.5px;color:var(--hint)}
.strip .bar{flex:1;height:5px;border-radius:3px;background:rgba(120,120,128,.2);overflow:hidden}
.strip .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#6ec3ff);width:0;transition:width .5s cubic-bezier(.3,1,.4,1)}
.strip b{color:var(--text);font-weight:600}

/* ================== КАРТОЧКИ / СПИСКИ ================== */
.pad{padding:10px}
.card{background:var(--bg);border-radius:var(--r);box-shadow:var(--shadow);margin:10px;padding:16px;overflow:hidden}
.card.tight{padding:0}
.card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--hint);font-weight:700}
.card .h-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card .h-row h2{margin:0}
.mini{font-size:13px;color:var(--link);font-weight:600;padding:4px 6px;border-radius:8px}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:5px 10px;border-radius:100px;background:rgba(10,124,255,.12);color:var(--link);letter-spacing:.2px
}
.chip.gray{background:rgba(120,120,128,.14);color:var(--hint)}
.chip.green{background:rgba(46,165,82,.14);color:var(--ok)}
.chip.amber{background:rgba(224,144,11,.16);color:var(--amber)}
.list{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin:10px;background:var(--bg)}
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-bottom:.5px solid var(--sep);position:relative}
.row:last-child{border-bottom:0}
.row:active{background:rgba(120,120,128,.08)}
.num{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(10,124,255,.12);color:var(--link)}
.num.done{background:rgba(46,165,82,.16);color:var(--ok)}
.row .rw{flex:1;min-width:0}
.row .rw h3{margin:0 0 3px;font-size:15.5px;font-weight:600;line-height:1.28;letter-spacing:-.2px}
.row .rw p{margin:0;font-size:12.5px;color:var(--hint);line-height:1.4}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:100px;background:rgba(120,120,128,.14);color:var(--hint);flex:none}
.check{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;align-self:center}
.check svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ================== ЧТЕНИЕ ЛЕКЦИИ ================== */
.hero{background:var(--bg);padding:18px 16px 16px;border-bottom:.5px solid var(--sep)}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.hero h2{margin:0 0 8px;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.5px}
.hero .meta{font-size:12.5px;color:var(--hint);line-height:1.5}
.prose{line-height:1.66;font-size:calc(var(--fs) - .5px)}
.prose p{margin:0 0 11px}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:650}
.prose b.np{color:var(--link);font-weight:600}
.prose ul,.prose ol{margin:0 0 12px;padding-left:20px}
.prose li{margin:0 0 7px}
.prose li::marker{color:var(--accent);font-weight:700}
.prose h4{margin:16px 0 8px;font-size:16px;font-weight:650;letter-spacing:-.2px}
.npa{border-left:3px solid var(--accent);background:rgba(10,124,255,.06);border-radius:0 12px 12px 0;padding:11px 13px;margin:12px 0;font-size:calc(var(--fs) - 1px)}
.npa .cap{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--link);margin-bottom:5px}
.fact{background:rgba(120,120,128,.1);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:calc(var(--fs) - 1px)}
.fact .cap{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--hint);margin-bottom:5px}
.plan{margin:0;padding:0;list-style:none;counter-reset:pl}
.plan li{counter-increment:pl;position:relative;padding:11px 12px 11px 46px;border-radius:12px;background:rgba(120,120,128,.08);margin-bottom:8px;font-size:calc(var(--fs) - .5px);line-height:1.45;font-weight:500}
.plan li:last-child{margin-bottom:0}
.plan li:before{content:counter(pl);position:absolute;left:12px;top:11px;width:24px;height:24px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.acc{border-bottom:.5px solid var(--sep)}
.acc:last-child{border-bottom:0}
.acc-h{display:flex;align-items:flex-start;gap:10px;padding:14px 2px;width:100%;text-align:left}
.acc-h .t{flex:1;font-size:15.5px;font-weight:600;line-height:1.35;letter-spacing:-.2px}
.acc-h .ar{width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--hint);transition:transform .25s ease;margin-top:1px}
.acc.open .acc-h .ar{transform:rotate(180deg);color:var(--accent)}
.acc-h .ar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.acc-b{display:none;padding:2px 2px 16px}
.acc.open .acc-b{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
dl.terms{margin:0}
dl.terms dt{font-weight:650;color:var(--accent);font-size:calc(var(--fs) - .5px);margin-bottom:3px}
dl.terms dd{margin:0 0 13px;padding:0 0 13px;border-bottom:.5px solid var(--sep);line-height:1.6;font-size:calc(var(--fs) - 1px)}
dl.terms dd:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
ul.sum{margin:0;padding-left:20px;line-height:1.6;font-size:calc(var(--fs) - .5px)}
ul.sum li{margin-bottom:9px}
ul.sum li:last-child{margin-bottom:0}
ul.sum li::marker{color:var(--ok);font-weight:700}
ol.q{margin:0;padding-left:22px;line-height:1.55;font-size:calc(var(--fs) - .5px)}
ol.q li{margin-bottom:11px}
ol.q li:last-child{margin-bottom:0}
ol.q li::marker{color:var(--accent);font-weight:700}
.readbar{display:flex;gap:10px;margin:12px 10px 4px}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:14px 16px;
  border-radius:14px;font-weight:650;font-size:15.5px;letter-spacing:-.2px;background:var(--btn);color:var(--btntxt);
  transition:transform .12s ease,opacity .2s
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(120,120,128,.14);color:var(--link)}
.btn.green{background:var(--ok);color:#fff}
.nav2{display:flex;gap:10px;margin:10px 10px 18px}
.nav2 button{flex:1;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);padding:13px;text-align:left;min-width:0}
.nav2 button.nx{text-align:right}
.nav2 .lbl{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.nav2 .ttl{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nav2 button:active{opacity:.75}

/* ================== ЛЕКЦИЯ-БАР ДЛЯ ЗАКЛАДОК ================== */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);z-index:45;
  display:flex;background:var(--bg);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)
}
.tabbar button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--hint);font-size:10.5px;font-weight:600;letter-spacing:.1px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}

/* ================== DRAWER ================== */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .28s;z-index:60}
.ovl.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(88%,350px);z-index:70;background:var(--bg);
  transform:translateX(-102%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)
}
.drawer.on{transform:none}
.drawer .d-head{padding:16px 16px 12px;border-bottom:.5px solid var(--sep)}
.drawer .d-head h3{margin:2px 0 4px;font-size:19px;font-weight:700;letter-spacing:-.4px}
.drawer .d-head p{margin:0;font-size:12.5px;color:var(--hint)}
.d-scroll{flex:1;overflow-y:auto;padding:8px 0 20px}
.d-row{display:flex;gap:11px;align-items:center;padding:11px 16px;width:100%;text-align:left}
.d-row:active{background:rgba(120,120,128,.1)}
.d-row .t{flex:1;min-width:0}
.d-row .t b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.2px}
.d-row .t span{font-size:11.5px;color:var(--hint)}
.d-row .n{width:28px;height:28px;border-radius:9px;background:rgba(10,124,255,.12);color:var(--link);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.d-row .n.done{background:rgba(46,165,82,.16);color:var(--ok)}
.d-sec{padding:14px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--hint);font-weight:700}
.searchwrap{padding:10px 12px;border-bottom:.5px solid var(--sep);background:var(--bg)}
.inp{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid transparent;background:rgba(120,120,128,.12);
  font-size:15px;color:var(--text);font-family:inherit;outline:none
}
.inp:focus{border-color:var(--accent);background:var(--bg)}
.inp::placeholder{color:var(--hint)}
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet.on{transform:none}
.sheet .s-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:.5px solid var(--sep)}
.sheet .s-body{flex:1;overflow-y:auto;padding:8px 0 20px}
.res{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.res:active{background:rgba(120,120,128,.1)}
.res .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--link);font-weight:700;margin-bottom:3px}
.res b{display:block;font-size:15px;font-weight:600;margin-bottom:2px;letter-spacing:-.2px}
.res p{margin:0;font-size:12.5px;color:var(--hint);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ================== СТАТИСТИКА / ПРОЧЕЕ ================== */
.ring{display:flex;align-items:center;gap:16px}
.ring .rr{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:700;letter-spacing:-.5px}
.stat{flex:1;min-width:0}
.stat .it{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:.5px solid var(--sep)}
.stat .it:last-child{border-bottom:0}
.stat .it b{font-weight:650}
.setrow{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:.5px solid var(--sep)}
.setrow:last-child{border-bottom:0}
.setrow .t{flex:1}
.setrow .t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px}
.setrow .t span{font-size:12.5px;color:var(--hint);line-height:1.35;display:block;margin-top:2px}
.sw{width:48px;height:29px;border-radius:100px;background:rgba(120,120,128,.28);position:relative;flex:none;transition:background .22s}
.sw:after{content:"";position:absolute;top:2.5px;left:2.5px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .22s cubic-bezier(.3,1.2,.4,1)}
.sw.on{background:var(--ok)}
.sw.on:after{transform:translateX(19px)}
.fsz{display:flex;gap:6px}
.fsz button{width:40px;height:34px;border-radius:10px;background:rgba(120,120,128,.14);color:var(--text);font-weight:700}
.fsz button.on{background:var(--btn);color:var(--btntxt)}
.note{font-size:12.5px;color:var(--hint);line-height:1.55;padding:0 2px}
.empty{text-align:center;padding:56px 24px;color:var(--hint)}
.empty svg{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.4;margin-bottom:12px;opacity:.7}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;padding:5px 10px;border-radius:100px;background:rgba(120,120,128,.13);color:var(--hint);font-weight:600}
.head-cta{background:var(--bg);border-radius:var(--r);box-shadow:var(--shadow);margin:10px;padding:14px}
.head-cta .ct{font-size:14px;font-weight:600;margin-bottom:2px;letter-spacing:-.2px}
.head-cta .cs{font-size:12.5px;color:var(--hint);line-height:1.45}
.ghead{padding:14px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--hint);font-weight:700}
.to-top{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--btntxt);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:44;opacity:0;pointer-events:none;transition:opacity .25s}
.to-top.on{opacity:1;pointer-events:auto}
.to-top svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pv-banner{margin:10px;padding:11px 13px;border-radius:12px;background:rgba(224,144,11,.14);color:var(--amber);font-size:12.5px;line-height:1.45}
.hide{display:none !important}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="ibtn" id="btnMenu" aria-label="Содержание">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="t-title">
      <h1>Архивоведение</h1>
      <div class="sub" id="subTitle">15 лекций · 30 ч. · Национальный архивный фонд РУз</div>
    </div>
    <button class="ibtn" id="btnSearch" aria-label="Поиск">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    </button>
  </header>
  <div class="strip">
    <div class="bar"><i id="pBar"></i></div>
    <div><b id="pNum">0</b>/15 изучено</div>
  </div>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="catalog" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h6v15H4zM14 5h6v6h-6zM14 14h6v6h-6z"/></svg>Содержание</button>
  <button data-tab="glossary"><svg viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 013 3v13H8a3 3 0 01-3-3zM17 20V7"/><path d="M9 8h4M9 12h4"/></svg>Глоссарий</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M8 19V11M13 19V7M18 19v-5"/></svg>Прогресс</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10L5.6 18.4"/></svg>Ещё</button>
</nav>

<div class="ovl" id="ovl"></div>
<aside class="drawer" id="drawer"></aside>
<div class="sheet" id="searchSheet"></div>
<button class="to-top" id="toTop" aria-label="Наверх"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6"/></svg></button>

<script>
/* =========================================================
   УЧЕБНЫЕ ДАННЫЕ: 15 ЛЕКЦИЙ ПО ДИСЦИПЛИНЕ «АРХИВОВЕДЕНИЕ»
   ========================================================= */
const LECTURES = [
{
id:1, module:"Модуль I. Теоретико-методологические основы архивоведения",
title:"Предмет, цель и задачи архивоведения", hours:2,
tags:["архивоведение","предмет науки","НАФ РУз","терминология","архивное право"],
intro:`<p>Архивоведение — это комплексная научная и учебная дисциплина, изучающая историю, организацию, теорию и методику работы с архивными документами, а также закономерности формирования, сохранения и использования информационного потенциала документального наследия. Для Республики Узбекистан, обладающей уникальным документальным пластом — от согдийских документов горы Муг до фондов хивинских, бухарских и кокандских канцелярий и документов периода независимости, — архивоведение имеет не только прикладное, но и государственно-стратегическое значение: оно обеспечивает историческую память, правовую защищённость граждан и национальную идентичность.</p><p>В настоящей лекции раскрываются объект и предмет науки, её цели, задачи и функции, место в системе смежных дисциплин, а также нормативно-правовая база архивного дела Республики Узбекистан, включая Закон «Об архивном деле» и деятельность Агентства «Узархив» при Кабинете Министров.</p>`,

],
sections:[
{t:"1.1. Архивоведение как научная и учебная дисциплина: объект, предмет, структура", c:`<p><strong>Архивоведение</strong> (от греч. <em>archeion</em> — присутственное место, учреждение, и лат. <em>archivum</em> — архив) — научная дисциплина, изучающая процессы создания, накапливания, отбора, учёта, хранения и использования архивных документов, а также систему архивных учреждений и управление архивным делом. Термин «архив» в профессиональном смысле имеет три значения: (1) учреждение или структурное подразделение, осуществляющее хранение документов; (2) совокупность документов, образовавшихся в деятельности организации или лица; (3) помещение (здание), в котором размещены документы.</p><p><strong>Объектом</strong> архивоведения выступает архивное дело как область практической деятельности и совокупность архивных документов (документальное наследие), <strong>предметом</strong> — закономерности и принципы комплектования, учёта, обеспечения сохранности, научной организации документальных комплексов и их использования в интересах общества, государства и личности.</p><p>Современное архивоведение представляет собой многокомпонентную дисциплину, включающую:</p><ul>
<li><strong>теорию и методику архивного дела</strong> — научные принципы экспертизы ценности, комплектования, систематизации и описания документов;</li>
<li><strong>историю и организацию архивного дела</strong> — развитие архивов и архивной службы от древности до наших дней, в том числе архивов Средней Азии и Узбекистана;</li>
<li><strong>архивное право и правовое регулирование</strong> — законы, постановления Кабинета Министров, положения, правила;</li>
<li><strong>научно-справочный аппарат (НСА)</strong> — теорию и методику создания описей, путеводителей, каталогов, указателей, обзоров, тематических баз данных;</li>
<li><strong>обеспечение сохранности документов</strong> — физико-химические, технические, режимные аспекты хранения;</li>
<li><strong>архивную информатику и автоматизированные технологии</strong> — оцифровку, электронные архивы, ЭЦП, электронный документооборот;</li>
<li><strong>археографию</strong> — правила выявления, передачи и публикации исторических источников.</li></ul>
<div class="fact"><span class="cap">Важно понимать</span>Архивоведение нельзя сводить к «правилам хранения документов»: это наука о документальной памяти нации, которая соединяет источниковедение, право, информационные технологии и документоведение.</div>`},
{t:"1.2. Цель, задачи и функции архивоведения", c:`<p><strong>Главная цель</strong> архивоведения — теоретическое обоснование и научно-методическое обеспечение формирования, сохранности и эффективного использования Национального архивного фонда Республики Узбекистан как неотъемлемой части историко-культурного наследия и информационных ресурсов общества.</p><p>К <strong>теоретическим задачам</strong> относятся: разработка и уточнение понятийно-терминологического аппарата; научное обоснование критериев экспертизы ценности документов; теория комплектования архивов и системы организации архивных фондов; теория научно-справочного аппарата и информационного поиска; концепция архивной информации как ресурса открытого государства; методология применения ИИ и цифровой обработки.</p><p>К <strong>практическим (прикладным) задачам</strong> относятся: разработка правил, положений, инструкций и методических рекомендаций; организация ведомственных и государственных архивов; нормирование труда архивистов; контроль за делопроизводством и упорядочением документов в организациях — источниках комплектования; подготовка квалифицированных кадров; внедрение информационной системы «Архивное дело» и поэтапная оцифровка документов Национального архивного фонда.</p><p>Архивоведение выполняет ряд <strong>функций</strong>:</p><ul>
<li><strong>познавательную (гносеологическую)</strong> — изучение закономерностей документальной эволюции общества;</li>
<li><strong>социально-правовую</strong> — обеспечение граждан документами, подтверждающими трудовой стаж, право собственности, образование, награды, реабилитацию;</li>
<li><strong>историко-культурную</strong> — выявление и сохранение памятников письменной культуры, включая фонды эпохи Темуридов, хивинских и бухарских ханов;</li>
<li><strong>информационную (ресурсную)</strong> — превращение архивов в открытый информационный ресурс, доступный через центры государственных услуг и ЕПИГУ;</li>
<li><strong>управленческую (контрольную)</strong> — государственный контроль за соблюдением правил делопроизводства и хранения документов;</li>
<li><strong>воспитательную и идеологическую</strong> — формирование исторического сознания, чувство уважения к национальному наследию.</li></ul>
<div class="npa"><span class="cap">Ключевая норма</span>Согласно Закону Республики Узбекистан «Об архивном деле», Национальный архивный фонд Республики Узбекистан состоит из государственной и негосударственной частей, является составной частью историко-культурного наследия народа Узбекистана и находится под защитой государства. Сохранение документов — обязанность всех физических и юридических лиц.</div>`},
{t:"1.3. Место архивоведения в системе наук и профессиональная компетенция архивиста", c:`<p>Архивоведение носит междисциплинарный характер и находится на пересечении гуманитарных, юридических и информационных наук:</p><ul>
<li>с <strong>историей и источниковедением</strong> его связывает общий объект — документ как исторический источник; архивоведение готовит источники к научному использованию;</li>
<li>с <strong>документоведением и делопроизводством (ДОУ)</strong> — общие процессы создания документов и организации документооборота; качество делопроизводства напрямую определяет качество будущих архивных фондов;</li>
<li>с <strong>архивным правом</strong> — совокупность норм, регулирующих права собственности на документы, доступ, сроки хранения, ответственность за их утрату;</li>
<li>с <strong>информатикой и ИКТ</strong> — электронные документы, базы данных, машиночитаемые описи, интернет-порталы архивов;</li>
<li>со <strong>специальными историческими дисциплинами</strong> — палеографией, сфрагистикой, дипломатикой, нумизматикой, генеалогией, хронологией;</li>
<li>с <strong>библиотековедением, музееведением и книговедением</strong> — общие принципы фондирования, каталогизации и обслуживания пользователей;</li>
<li>с <strong>лингвистикой</strong> — работа с документами на узбекском, арабском, персидско-таджикском, староузбекском (чагатайском), русском языках, вопросы транслитерации и перевода;</li>
<li>с <strong>химией, физикой и материаловедением</strong> — реставрация, фумигация, микроклимат, стандартизация носителей.</li></ul>
<p>В развитии архивной науки значительную роль сыграли труды отечественных и зарубежных учёных: в России — Н. В. Калачов, А. С. Лаппо-Данилевский, В. В. Максаков, К. Г. Митяев, В. Н. Автократов; в Узбекистане — историки и архивоведы, разрабатывавшие историю документального наследия Туркестана и Узбекистана (в том числе академик Б. В. Лунин и исследователи среднеазиатских архивов). Их вклад — создание научной периодизации архивного дела, описание фондов, составление научных справочников.</p>
<div class="fact"><span class="cap">Профессиональный стандарт</span>Современный архивист должен владеть: знанием НПА, методикой экспертизы ценности и описания дел, навыками работы с НСА, основами реставрации и хранения, ИКТ-компетенциями (сканирование, метаданные, электронные архивы), языковой подготовкой и умением вести научно-исследовательскую работу.</div>`},
{t:"1.4. Нормативно-правовые и институциональные основы архивного дела в Республике Узбекистан", c:`<p>Правовую основу архивного дела Республики Узбекистан составляют Конституция Республики Узбекистан (в новой редакции, 2023 г.), гарантирующая право граждан искать, получать и распространять информацию, специальные и смежные законы, а также акты Президента и Кабинета Министров:</p><ul>
<li><strong>Закон Республики Узбекистан «Об архивах»</strong> от 15 апреля 1999 года — первый специальный закон, введший понятие «Национальный архивный фонд Республики Узбекистан»;</li>
<li><strong>Закон Республики Узбекистан «Об архивном деле»</strong> (2010 г., в действующей редакции) — определил состав НАФ из государственной и негосударственной частей, полномочия Кабинета Министров, Агентства «Узархив» и местных органов власти;</li>
<li><strong>Закон Республики Узбекистан «Об информации»</strong> (новая редакция, 2019 г.) и <strong>Закон «О документировании информации и электронном документообороте»</strong> (2018 г.) — основа работы с электронными документами;</li>
<li><strong>Закон «О защите персональных данных»</strong> (2019 г.) — регулирует доступ к документам по личному составу;</li>
<li><strong>Закон «Об обращениях физических и юридических лиц»</strong> (2014 г.) — устанавливает порядок исполнения запросов граждан;</li>
<li><strong>Положение о порядке комплектования, государственного учёта, хранения и использования архивных документов</strong> и <strong>Положение о Государственном каталоге Национального архивного фонда</strong>, утверждённые постановлениями Кабинета Министров Республики Узбекистан (в действующей редакции).</li>
<li><strong>Указ Президента Республики Узбекистан от 20 сентября 2019 года</strong> «О мерах по совершенствованию архивного дела и делопроизводства в Республике Узбекистан» и сопутствующее постановление — о создании Агентства «Узархив» Республики Узбекистан, Национального архива Узбекистана и передаче части архивных услуг в центры государственных услуг.</li></ul>
<div class="npa"><span class="cap">Вехи институционального развития</span>1992 г. — постановление Кабинета Министров «Об утверждении Положения о Главном архивном управлении при Кабинете Министров РУз (“Узглавархив”) и сети центральных государственных архивов»; 2004 г. — постановление «О дальнейшем совершенствовании управления архивным делом в Республике Узбекистан»; с 2019 г. — Агентство «Узархив» Республики Узбекистан; созданы Национальный архив Узбекистана и информационная система «Архивное дело».</div>
<p>В системе государственных архивов Республики Узбекистан (более 100 государственных архивов) хранятся миллионы единиц хранения: фонды центральных государственных архивов (исторический архив, архив кинофотофонодокументов, архив научно-технической документации), областные и районные (городские) архивы, архивы по личному составу. Подготовка специалистов по архивоведению ведётся в системе высшего образования Республики Узбекистан (направления «История», «Архивоведение», «Документоведение и архивоведение»).</p>`}
],

intro:`<p>Изучение истории архивного дела позволяет понять, как общество постепенно осознавало ценность документа: сначала как вещного свидетельства права собственности, затем как инструмента управления и, наконец, как элемента культурного наследия. Первая часть курса охватывает период от древнейших цивилизаций до начала XX века и включает архивную культуру Западной Европы, Российской империи, а также особое внимание — документальному наследию Средней Азии: канцеляриям Саманидов, Темуридов, Бухарского эмирата, Хивинского ханства и Кокандского ханства.</p>`,
plan:[

sections:[
{t:"2.1. Зарождение документоучёта и архивов в государствах Древнего мира", c:`<p>Первые архивные комплексы появляются там, где возникает государственность и письменность: необходимостью становятся учёт земель, населения, налогов, договоров и судебных решений. Отличительная черта древних архивов — совмещение функций хранилища документов, канцелярии и священного места (документы хранились в храмах и дворцах, что придавало им правовую и сакральную силу).</p><ul>
<li><strong>Месопотамия и Шумер</strong> — клинописные таблички из глины; архивы храмов и царских хозяйств Ура и Лагаша (XXIV–XXII вв. до н. э.).</li>
<li><strong>Эбла (Северная Сирия)</strong> — архив середины III тысячелетия до н. э. из нескольких тысяч табличек хозяйственной и дипломатической отчётности.</li>
<li><strong>Хеттское царство</strong> — царский архив в Хаттусе (Богазкёй) с договорами, указами и анналами.</li>
<li><strong>Ассирия</strong> — библиотека-архив Ашшурбанапала в Ниневии (VII в. до н. э.), десятки тысяч табличек: литературные тексты, судебные протоколы, письма.</li>
<li><strong>Египет</strong> — дворцовые и храмовые архивы на папирусе; знаменитые арамейские папирусы Элефантины (V в. до н. э.), отражающие жизнь военной колонии в Египте.</li>
<li><strong>Персидская держава Ахеменидов</strong> — административный архив Персеполя (VI–V вв. до н. э.): тысячи табличек с отчётами о выдаче продуктов и оплате труда, ценнейший источник по экономике и этнографии, в том числе территорий Средней Азии.</li>
<li><strong>Античная Греция</strong> — в Афинах государственные документы хранились в храме Матери богов (Метрооне); существовали «анаграфисты» — должностные лица, ведшие записи.</li>
<li><strong>Рим</strong> — <em>tabularium</em> (78 г. до н. э.) — специально построенное здание для хранения публичных документов в Риме; система публичных записей (<em>acta publica</em>), архивы при храмах Сатурна и Дианы.</li></ul>
<div class="fact"><span class="cap">Исторический факт</span>Материал носителя определял технологию хранения: глиняные таблички обжигались (и потому сохранились тысячелетиями), папирус и пергамен требовали сухого, прохладного помещения — уже в древности складывались практические требования к режиму хранения документов.</div>`},
{t:"2.2. Архивы средневековья и Нового времени: путь к централизации и научным принципам", c:`<p>В средние века в Европе главными хранителями документов были церковь и монархия. Монастырские архивы (Монте-Кассино, Санкт-Галлен) сохраняли грамоты, дарственные акты, картулярии — копии документов, собранных для защиты имущественных прав. Королевские архивы складывались при дворах: во Франции — «Сокровищница хартий» (Trésor des chartes, XIV в.), в Англии — архивы при Казначействе и Королевской канцелярии, в Ватикане — папский архив (официально реорганизованный в 1612 г.).</p><p>В период Нового времени возникают специализированные государственные архивы:</p><ul>
<li><strong>Симанкас (Испания, 1543)</strong> — один из первых централизованных королевских архивов Европы;</li>
<li><strong>Архив Генерального института Индий (Севилья, 1785)</strong> — собрание документов испанской колониальной администрации;</li>
<li><strong>Франция</strong>: революция 1789 года привела к созданию <strong>Национального архива</strong> и закона от 7 сентября 1790 года о его организации — впервые архив провозглашался доступным для граждан (принцип публичности и свободного доступа);</li>
<li><strong>XIX век</strong>: складываются национальные архивы, создаются исторические архивы при министерствах, появляются профессиональные общества и периодика, проводятся международные конгрессы архивистов (Брюссель, 1910 г.), что заложило основы международного сотрудничества.</li></ul>
<p>Ключевым научным достижением XIX века стало формирование <strong>принципа провениенции (принципа происхождения, respect des fonds)</strong>: документы должны систематизироваться по фондообразователям, а не по предметному признаку. Его обоснование связывается с работами французского архивиста Наталиса де Вайи (циркуляр 1841 г.) и развитием фондовой теории в прусской и итальянской школах. Этот принцип стал фундаментом современной практики систематизации и составления научно-справочного аппарата.</p>
<div class="npa"><span class="cap">Значение для курса</span>Принцип происхождения лежит в основе понятий «архивный фонд», «фондообразователь», «опись», применяемых и в практике Национального архивного фонда Республики Узбекистан.</div>`},
{t:"2.3. Архивная культура Средней Азии: от древних памятников до канцелярий ханств", c:`<p>Территория Узбекистана — один из древнейших очагов письменной культуры. Здесь сложилась особая традиция документирования и хранения актов, обусловленная развитием городской жизни, ирригации, караванной торговли и государственности.</p><ul>
<li><strong>Древность и раннее средневековье.</strong> Уникальный источник — <strong>согдийские документы с горы Муг</strong> (Пенджикентская область, находка 1932 г.), датируемые началом VIII века: письма правителя Панча (Диваштича), хозяйственные записи, юридические документы. Найдены также документы из Айртама, Кафыр-калы и других памятников, свидетельствующие о развитой канцелярской практике Согда, Бактрии и Хорезма.</li>
<li><strong>Эпоха Саманидов, Караханидов, Хорезмшахов (IX–XIII вв.)</strong> — диваны (ведомства) вели реестры налогов, жалования, переписку; документация велась на арабском языке, параллельно существовала местная письменность. Развиваются библиотеки-хранилища (<em>хизанат аль-кутуб</em>), при дворцах действуют канцелярии, где служили мунши (писцы) и катыбы.</li>
<li><strong>Монгольский период и эпоха Темуридов (XIII–XV вв.)</strong> — оформляется система <em>ярыг (ярлыков)</em> — ханских указов, <em>фарманов</em>, <em>тарханных грамот</em>, освобождающих от налогов. При дворах Темура и Темуридов действовали <strong>давотхона</strong> (канцелярия) и <strong>китобхона</strong> (книжно-документальное хранилище), где работали каллиграфы, переписчики и миниатюристы; Самарканд и Герат стали центрами документальной культуры.</li>
<li><strong>Шейбаниды и Аштарханиды (XVI–XVIII вв.)</strong> — широкое развитие вакфной документации (документы о пожертвованиях в пользу мечетей и медресе), «сиратных» (налоговых) книг, купчих (<em>ватика</em>, <em>худжжат</em>), судебных решений.</li>
<li><strong>Бухарский эмират, Хивинское ханство, Кокандское ханство (XVIII — начало XX вв.)</strong> — сложилась разветвлённая канцелярская система: при бухарском эмире — диванбеги, кушбеги, даха-баши, мирзы (писцы); при хивинском хане — мехтар, диванбеги, шейх-уль-ислам; в Коканде — мингбаши, датха, кушбеги. Сохранились фонды указов (<em>фармон</em>), ярлыков, вакфных документов, налоговых реестров, посольской переписки, а также городские документы (записи аксакалов, квартальных общин — махаллей). Часть этих документов хранится в фондах Центрального государственного исторического архива Республики Узбекистан.</li></ul>
<div class="fact"><span class="cap">Ключевой факт</span>После событий 751 г. у Таласа в Самарканде появляется бумажное производство, освоенное китайскими мастерами. Самаркандская бумага стала основным носителем деловой документации Средней Азии и распространилась на Ближний Восток и в Европу — фактор, во многом определивший характер и сохранность региональных архивов.</div>`},
{t:"2.4. Архивы Российской империи и становление архивного дела в Туркестанском крае", c:`<p>В Московском государстве XVI–XVII веков документы хранились по приказам (Посольский, Разрядный, Поместный приказы и др.), образуя «приказные архивы». Реформы Петра I внесли принципиальные изменения: <strong>Генеральный регламент 28 февраля 1720 года</strong> предписал коллегиям иметь собственные архивы и установил порядок сдачи дел «в архив с распискою», что считается началом организованного архивного дела в России. В XVIII–XIX веках архивы возникают при Сенате, коллегиях, министерствах, Академии наук.</p><p>В XIX веке формируются основы научной архивистики: <strong>Н. В. Калачов</strong> (1819–1885) — инициатор архивной реформы, основатель Археологического института (1877), где впервые началась подготовка архивистов; в 1852 году образован Московский архив Министерства юстиции — первый специализированный исторический архив. Проводятся археологические съезды, публикуются описи и акты, издаются «Русская историческая библиотека» и сборники документов.</p><p>После присоединения Туркестана (1865–1876) в крае складывается русская административная документация: канцелярия Туркестанского генерал-губернатора (центр — Ташкент, 1867 г.), областные правления Сырдарьинской, Ферганской, Самаркандской, Семиреченской и Закаспийской областей, суды, налоговые и статистические органы, управления железных дорог и оросительных систем. При областных правлениях и канцеляриях создаются архивы, где параллельно ведутся документы на русском и на местных языках (переводы, «туземные» акты). Значительная часть документации периода Российской империи (1865–1917) впоследствии составила основу фондов Центрального государственного исторического архива Республики Узбекистан.</p>
<div class="npa"><span class="cap">Особенность Туркестанского архива</span>Двуязычный характер документооборота и сосуществование двух правовых систем (имперской и местного обычного права) сформировали уникальный комплекс источников, требующий от архивиста знания восточных языков и навыков работы с арабской графикой.</div>
<p>Таким образом, к началу XX века на территории будущего Узбекистана сосуществовали три архивные традиции: местная (канцелярии ханств), имперская (административные архивы Туркестана) и формирующаяся научная (музеи, учёные комитеты, краеведческие общества, ведшие систематическое собирание документов).</p>`}

intro:`<p>Вторая часть исторического обзора посвящена советскому периоду (1918–1991), когда архивное дело впервые получило государственный, централизованный характер: единый архивный фонд, система центральных и местных архивов, профессиональное управление и подготовка кадров. Для Узбекистана этот период означает создание собственной национальной архивной сети — от Цуардела Туркестана и Узбекистана до сети центральных государственных архивов, многие из которых продолжают функционировать и сегодня как составная часть Национального архивного фонда Республики Узбекистан.</p>`,

sections:[
{t:"3.1. Архивная реформа 1918 года и Единый государственный архивный фонд", c:`<p>Октябрьская революция 1917 года привела к коренному переустройству архивного дела. Декретом Совета Народных Комиссаров РСФСР от <strong>1 июня 1918 года «О реорганизации и централизации архивного дела в РСФСР»</strong> были закреплены принципиальные новации:</p><ul>
<li>все документы правительственных учреждений, организаций и предприятий объявлялись собственностью государства;</li>
<li>образовывался <strong>Единый государственный архивный фонд (ЕГАФ)</strong> — совокупность документов, находящихся в ведении государства;</li>
<li>создавалось <strong>Главное управление архивным делом</strong> (Центрархив) — единый орган управления архивами;</li>
<li>ведомственные архивы упразднялись, а учреждения лишались права уничтожать документы без письменного разрешения архивного управления;</li>
<li>провозглашался принцип централизации, гласности и доступности архивов для научной работы.</li></ul>
<p>В 1920-е годы развивается научно-методическая база: создаются учёные комиссии, издаются журналы («Архивное дело»), разрабатываются правила описания, формируется фондовая теория, начинают систематически выявляться документы предшествующих эпох, включая дореволюционные и востоковедные фонды.</p>
<div class="fact"><span class="cap">Сущность реформы</span>Положительная сторона реформы — централизация, спасение документальных комплексов от расхищения и уничтожения, создание национальных архивов. Отрицательная — огосударствление всех документов, утрата права собственности фондообразователей, идеологизация комплектования и закрытость части фондов.</div>`},
{t:"3.2. Архивное дело в Туркестане и Узбекистане в 1918–1930-е годы", c:`<p>Реформа быстро распространилась на Туркестанский край. В 1919 году был создан архивный орган управления Туркестана (ГУардел/Цуардел — Губернское (Центральное) управление архивным делом) и провозглашён <strong>Единый государственный архивный фонд Туркестана</strong>. В 1919–1924 годах принимаются специальные декреты и акты, регулирующие порядок комплектования, хранения и уничтожения документов, запрещается самовольное перемещение фондов, ставится вопрос о специальных архивохранилищах.</p><p>Важнейшие организационные вехи:</p><ul>
<li><strong>1920 год</strong> — образованы областные государственные архивные фонды: Ферганский (март 1920 г.), Самаркандский (июнь 1920 г.), Семиреченский (ноябрь 1920 г.), Закаспийский (март 1921 г.); 25 января 1921 г. принято постановление Совнаркома о порядке их деятельности;</li>
<li><strong>1924 год</strong> — национально-территориальное размежевание Средней Азии: ликвидируются учреждения прежних образований, их фонды распределяются между республиками; архивные фонды, относящиеся к другим республикам, передаются их архивным органам, а часть документов остаётся в Ташкенте;</li>
<li><strong>1925 год</strong> — с образованием Узбекской ССР создаётся <strong>Центральное управление архивным делом (Цуардел) Узбекистана</strong>; основное хранилище размещается в Самарканде (первой столице республики), создаются отделения в Ташкенте и Фергане; в 1925–1929 годах на хранение принято 134 фонда; в 1925 году образовано Самаркандское областное архивное бюро (в 1927 г. реорганизовано);</li>
<li><strong>1930 год</strong> — формируется сеть центральных государственных архивов: Центральный государственный архив Октябрьской революции, Центральный государственный исторический архив, Центральный архив профессионального движения, Центральный государственный военный архив; с начала 1930-х годов управление называется ЦАУ (Центральное архивное управление);</li>
<li>ликвидируется «секционная» система организации архивов, вводится фондовая структура хранения.</li></ul>
<div class="npa"><span class="cap">Итог периода</span>К началу 1930-х годов в Узбекистане сложилась централизованная государственная архивная служба с фондовой организацией хранения, началось создание описей, паспортов фондов, первых научных справочников. Одновременно комплектование стало строго идеологически направленным: приоритет отдавался документам партийных и советских органов.</div>`},
{t:"3.3. Архивная система 1930–1950-х годов: управление, кадры, документы войны", c:`<p>В 1931–1957 годах архивная система окончательно разделяется на орган управления (ЦАУ/Архивное управление) и сеть центральных государственных архивов с территориальными отделениями. В 1938 году архивное дело переводится в систему НКВД (затем МВД), что усилило контроль, но одновременно повысило режимность и закрытость фондов; важнейшей задачей стала проверка сохранности и выявление «враждебных» документов.</p><p>В годы <strong>Великой Отечественной войны (1941–1945)</strong> архивисты Узбекистана решали двуединую задачу: обеспечить эвакуацию и сохранность документов, а также принять документальные комплексы эвакуированных предприятий и учреждений. Одновременно комплектовались фонды военного времени: документы о мобилизации, работе эвакогоспиталей, строительстве оборонительных объектов, трудовом подвиге тружеников тыла, размещении эвакуированных предприятий и научно-исследовательских институтов в Ташкенте, Самарканде и других городах.</p><p>После войны происходит восстановление и расширение сети: создаются специализированные архивы, в том числе хранилища научно-технической документации и кинофотофондов; усиливается работа по составлению описей и справочников; открывается доступ исследователей к документам по истории индустриализации и колхозного строительства. Формируется кадровая база: специалисты исторических факультетов Среднеазиатского (Ташкентского) государственного университета и преподавание архивных дисциплин.</p>
<div class="fact"><span class="cap">Документальное наследие войны</span>Фонды 1941–1945 годов сегодня являются наиболее востребованными при подготовке книг памяти, музейных экспозиций и патриотических проектов, поскольку содержат сведения о судьбах конкретных людей — призванных, эвакуированных, награждённых, погибших.</div>`},
{t:"3.4. Архивы Узбекской ССР во второй половине XX века", c:`<p>С 1960-х годов архивная служба Узбекистана функционирует как Архивное управление при Совете Министров УзССР с сетью центральных и местных архивов. Складывается типовая структура: центральные государственные архивы (исторический архив, архив Октябрьской революции и социалистического строительства, архив литературы и искусства, архив кинофотофонодокументов, архив научно-технической документации) и система областных, районных и городских архивов, включая архивы по личному составу.</p><p>Основные направления работы периода:</p><ul>
<li><strong>комплектование</strong> — приём документов учреждений после истечения сроков ведомственного хранения, профсоюзных, кооперативных, колхозных организаций;</li>
<li><strong>экспертиза ценности</strong> — работа экспертных комиссий и экспертно-проверочных комиссий (ЭПК), составление описей и актов;</li>
<li><strong>научно-справочный аппарат</strong> — описи, каталоги, тематические картотеки, путеводители, обзоры, печатные справочники о фондах;</li>
<li><strong>использование</strong> — читальные залы, исполнение запросов, подготовка документальных выставок, публикация сборников документов по истории республики;</li>
<li><strong>обеспечение сохранности</strong> — строительство архивохранилищ, введение режимов хранения, реставрация и переплёт, микрофильмирование;</li>
<li><strong>автоматизация</strong> — с 1970–1980-х годов начинается механизация поиска, создаются машинные картотеки и первые автоматизированные информационно-поисковые системы.</li></ul>
<p>Нормативную основу составляли «Основы законодательства Союза ССР и союзных республик об архивах» (1980 г.) и республиканские положения о Государственном архивном фонде и сети архивных учреждений. К концу 1980-х годов в государственных архивах Узбекистана накоплены миллионы единиц хранения, охватывающих период с XIX века до современности; часть древних и ценных комплексов составила фонд «документальных памятников».</p>
<div class="npa"><span class="cap">Правопреемство</span>После распада СССР (1991 г.) был решён вопрос о правопреемстве в отношении архивных документов бывших союзных республик: фонды, образовавшиеся на территории Узбекистана, закреплены за республикой; началась разработка национального архивного законодательства и понятия «Национальный архивный фонд».</div>`}
],

id:4, module:"Модуль III. Формирование и классификация документов НАФ РУз",
title:"Классификация документов Национального архивного фонда Республики Узбекистан. Часть 1", hours:2,
tags:["классификация","архивный фонд","коллекция","объединённый фонд","учёт","Государственный каталог"],
intro:`<p>Классификация — стержневой процесс архивной технологии: она превращает неупорядоченную массу документов в логически организованное, учитываемое и доступное для поиска документальное собрание. В первой части темы рассматриваются теоретические основы классификации, уровни и признаки, виды архивных фондов, состав Национального архивного фонда Республики Узбекистан по видам документов и носителей, а также государственная регистрация и учёт документов.</p>`,
plan:[
"Понятие, значение и уровни классификации архивных документов",

sections:[
{t:"4.1. Понятие, значение и уровни классификации архивных документов", c:`<p><strong>Классификация архивных документов</strong> — это научная деятельность по упорядочению документов в логически обоснованные группы (комплексы) на основе выбранных признаков с целью их учёта, обеспечения сохранности, поиска и эффективного использования. Классификация — не механическая сортировка: она опирается на знание истории фондообразователя, структуры управления, содержания деятельности и состава документов.</p><p>Классификация осуществляется на нескольких уровнях, образующих единую иерархию:</p><ul>
<li><strong>уровень НАФ (архива)</strong> — распределение документов между архивами по профилям, отраслям, территориям; определение принадлежности к государственной или негосударственной части фонда;</li>
<li><strong>уровень архивного фонда</strong> — систематизация документов внутри фонда (по структурным подразделениям, хронологии, видам документов, вопросам);</li>
<li><strong>уровень единицы хранения (дела)</strong> — расположение документов внутри дела;</li>
<li><strong>уровень НСА</strong> — классификация информации о документах (предметно-тематическая, именная, географическая классификации в каталогах и указателях).</li></ul>
<p>Классификация выполняет несколько функций: учётную (позволяет точно знать объём и состав), поисковую (создаёт адресную систему доступа), сохранностную (определяет порядок размещения и контроль наличия) и информационную (раскрывает содержание комплексов пользователю).</p>
<div class="fact"><span class="cap">Правовая основа</span>Порядок классификации, систематизации и учёта определяется Законом «Об архивном деле» и Положением о порядке комплектования, государственного учёта, хранения и использования архивных документов, утверждённым Кабинетом Министров Республики Узбекистан, а также правилами и инструкциями Агентства «Узархив».</div>`},
{t:"4.2. Признаки классификации и виды архивных фондов", c:`<p>Базовая единица классификации — <strong>архивный фонд</strong>: совокупность архивных документов, образовавшихся в процессе деятельности одного фондообразователя (учреждения, организации, предприятия, лица или семьи). Наряду с фондом выделяются:</p><ul>
<li><strong>объединённый архивный фонд</strong> — комплекс документов нескольких однородных по характеру деятельности и связи фондообразователей (например, фонды ликвидированных однотипных районных организаций);</li>
<li><strong>архивная коллекция</strong> — совокупность документов, образовавшихся по разным источникам и объединённых по одному или нескольким признакам (тематическому, именному, географическому, видовому) искусственно, в процессе собирания (коллекция документов по истории ирригации, коллекция фарманов, коллекция семейных фотографий);</li>
<li><strong>архивный фонд личного происхождения</strong> — документы граждан, семей, родов, содержащие сведения о личной и общественной деятельности;</li>
<li><strong>архивный фонд организации</strong> — документы юридического лица, существующего или ликвидированного, включая фонды правопреемников.</li></ul>
<p><strong>Признаки классификации</strong> (принципы группировки документов внутри фонда и при каталогизации):</p><ul>
<li><strong>структурный</strong> — по подразделениям фондообразователя (отделы, сектора, управления);</li>
<li><strong>хронологический</strong> — по периодам или годам;</li>
<li><strong>отраслевой (функциональный)</strong> — по направлениям деятельности;</li>
<li><strong>номинальный (видовой)</strong> — по видам документов (приказы, протоколы, планы, отчёты, переписка);</li>
<li><strong>авторский</strong> — по учреждениям или лицам — авторам документов;</li>
<li><strong>корреспондентский</strong> — по адресатам переписки;</li>
<li><strong>географический (территориальный)</strong> — по регионам, областям, районам;</li>
<li><strong>предметно-тематический</strong> — по содержанию вопросов;</li>
<li><strong>алфавитный, нумерационный</strong> — вспомогательные признаки.</li></ul>
<p>Выбор признака определяется составом фонда: для крупных учреждений типична схема «структура — хронология», для небольших организаций — «хронология — номинальный признак», для личных фондов — разделы «творческие материалы», «переписка», «биографические документы», «фотодокументы».</p>`},
{t:"4.3. Состав Национального архивного фонда Республики Узбекистан по видам документов и носителей", c:`<p>Национальный архивный фонд Республики Узбекистан многосоставен. По характеру и видам документов выделяются следующие группы:</p><ul>
<li><strong>управленческая (организационно-распорядительная) документация</strong> — постановления, решения, приказы, протоколы, положения, уставы, планы, отчёты, переписка;</li>
<li><strong>документы по личному составу</strong> — приказы по личному составу, трудовые договоры, личные карточки, лицевые счета, ведомости, акты; имеют длительный срок хранения (75 лет и более) и важнейшее социальное значение;</li>
<li><strong>научно-техническая документация</strong> — проектная, конструкторская, технологическая, научно-исследовательская документация, авторские свидетельства;</li>
<li><strong>кино-, фото-, фоно- и видеодокументы</strong> — хроники, документальные фильмы, фотонегативы, магнитные записи, являющиеся особо ценными и требующими специальных условий хранения;</li>
<li><strong>картографическая и геодезическая документация</strong> — топографические планы, карты ирригации и землеустройства;</li>
<li><strong>документы личного происхождения</strong> — фонды государственных и общественных деятелей, учёных, писателей, художников Узбекистана;</li>
<li><strong>электронные документы</strong> — документация в машиночитаемой форме, электронные архивы и базы данных, оцифрованные копии;</li>
<li><strong>документы негосударственной части НАФ</strong> — фонды частных организаций, фермерских хозяйств, общественных объединений, политических партий, граждан, прошедшие экспертизу ценности и поставленные на государственный учёт.</li></ul>
<p>По срокам хранения документы делятся на: <strong>постоянного (вечного) хранения</strong> — включаются в НАФ и передаются в государственные архивы; <strong>длительного хранения</strong> (свыше 10 лет, в том числе по личному составу — 75 лет); <strong>временного хранения</strong> (до 10 лет) — по истечении срока уничтожаются в установленном порядке после экспертизы ценности.</p>
<div class="npa"><span class="cap">Обратите внимание</span>Национальный архивный фонд включает как государственную, так и негосударственную части. Документы негосударственной части после государственной регистрации могут получить статус документов НАФ, при этом право собственности сохраняется за владельцем, а государство обеспечивает методическое содействие и учёт.</div>`},
{t:"4.4. Государственная регистрация, учёт документов НАФ и Государственный каталог", c:`<p><strong>Государственный учёт документов НАФ</strong> — это система фиксации состава, объёма и состояния архивных документов, обеспечивающая их сохранность и организацию поиска. Учёт ведётся по единым формам и принципам: централизованности, взаимосвязанности учётных документов, строгой регламентации форм, оперативности внесения изменений.</p><p>Основные учётные единицы и документы:</p><ul>
<li><strong>архивный фонд</strong> — основная учётная единица; ему присваивается номер в валовой последовательности;</li>
<li><strong>опись дел (документов)</strong> — учётный и справочный документ, закрепляющий систематизацию дел;</li>
<li><strong>лист фонда</strong> — фиксирует название, даты, объём и изменения в составе фонда;</li>
<li><strong>карточка (лист) фонда</strong>, <strong>книга учёта поступлений</strong>, <strong>книга учёта фондов</strong>, <strong>опись-титул</strong>;</li>
<li><strong>паспорт архива</strong> — ежегодная сводка о составе и объёме фондов, направляемая в орган управления архивным делом;</li>
<li><strong>дело фонда</strong> — комплекс документов по истории и учёту конкретного фонда (историческая справка, схема систематизации, акты, листы проверок).</li></ul>
<p><strong>Государственная регистрация документов НАФ</strong> предполагает внесение сведений о фондах негосударственных владельцев и выдачу соответствующих документов (свидетельств/сертификатов), подтверждающих принадлежность документов к Национальному архивному фонду и учитывающих права собственников. Сведения централизуются в <strong>Государственном каталоге Национального архивного фонда Республики Узбекистан</strong> — сводной информационной системе о составе и содержании фондов всех архивов, которая в условиях цифровизации переводится в электронную форму и интегрируется с информационной системой «Архивное дело».</p>
<div class="fact"><span class="cap">Практика</span>В государственных архивах Республики Узбекистан хранятся миллионы единиц хранения. Точность учёта — основа сохранности: ежегодно проводятся проверки наличия и состояния дел, составляются акты, а изменения отражаются одновременно во всех учётных документах.</div>`}

intro:`<p>Вторая часть темы посвящена практическим методикам систематизации: как внутри фонда группируются дела, как располагаются документы внутри дела, как классифицируются специальные виды документации (научно-техническая, аудиовизуальная, картографическая, электронная) и какое значение классификация имеет для организации поиска и каталогизации. Материал имеет прямое прикладное значение: на этих правилах строится повседневная работа архивиста при составлении описей и ведении НСА.</p>`,

sections:[
{t:"5.1. Классификация в пределах архивного фонда: схемы группировки дел", c:`<p>Внутри фонда дела располагаются по схеме систематизации, которая фиксируется в <strong>исторической справке</strong> и <strong>схеме систематизации фонда</strong>, хранящихся в деле фонда. Наиболее распространённые схемы:</p><ul>
<li><strong>структурная</strong> — дела группируются по подразделениям в соответствии с их субординацией (руководство, аппарат, отделы), внутри каждого блока — по хронологии и видам;</li>
<li><strong>хронологически-структурная</strong> — сначала периоды (например, до 1924 г., 1924–1938 гг., послевоенный период), затем внутри периода — по структуре; применяется для фондов, часто менявших структуру;</li>
<li><strong>структурно-хронологическая</strong> — сначала структурные части, затем годы;</li>
<li><strong>номинальная (видовая)</strong> — по видам документов: приказы, протоколы, планы, отчёты, сметы, переписка; характерна для небольших фондов;</li>
<li><strong>отраслевая (функциональная)</strong> — по направлениям деятельности (планирование, финансы, кадры, снабжение, строительство);</li>
<li><strong>предметно-тематическая</strong> — по содержанию вопросов; применяется для коллекций и личных фондов;</li>
<li><strong>адресатная (корреспондентская), географическая, авторская</strong> — вспомогательные схемы для переписки и документов разных авторов.</li></ul>
<p>Правила практической систематизации: дела группируются в пределах каждого года (или периода), внутри группы соблюдается очерёдность по видам и важности (приказы — протоколы — планы — отчёты — переписка); дела одного вида располагаются по хронологии или алфавиту; дела, охватывающие несколько лет, относят к году их заведения; личные дела систематизируются по алфавиту фамилий, судебные и следственные дела — по годам и номерам.</p>
<div class="fact"><span class="cap">Методическое правило</span>Схема систематизации не может произвольно меняться составителем описи: при необходимости её изменения оформляется соответствующий акт и вносятся изменения во все учётные документы фонда.</div>`},
{t:"5.2. Классификация документов внутри единицы хранения (дела)", c:`<p>Единица хранения — оформленная в обложку совокупность документов, учитываемая как отдельное дело. Внутри дела документы располагаются по одному из следующих порядков:</p><ul>
<li><strong>хронологический</strong> — по датам документов (переписка, отчёты, ведомости);</li>
<li><strong>вопросно-логический</strong> — по логике вопроса: сначала инициативные документы, затем ответные (в переписке — сначала запрос, потом ответ);</li>
<li><strong>алфавитный</strong> — по фамилиям или наименованиям (личные дела, списки, переписка с учреждениями);</li>
<li><strong>географический</strong> — по регионам;</li>
<li><strong>нумерационный</strong> — по порядковым номерам (приказы, протоколы, счета);</li>
<li><strong>структурный</strong> — по подразделениям-авторам документов.</li></ul>
<p>Соблюдение порядка имеет правовое и практическое значение: обеспечивает целостность дела, исключает утрату листов, позволяет проверять наличие и составлять внутренние описи. Для особо ценных и многосоставных дел составляется <strong>внутренняя опись</strong> — перечень документов дела с указанием их индексов, дат, заголовков и номеров листов. Каждое дело получает <strong>заголовок</strong>, точно отражающий содержание (вид документа, автор, корреспондент, вопрос, дата), и <strong>архивный шифр</strong> (номер фонда, описи, дела, листов), по которому документ может быть однозначно найден и процитирован.</p>
<div class="npa"><span class="cap">Справочный аппарат дела</span>Архивный шифр — обязательный элемент научной ссылки на документ. Он проставляется в листах использования, актах выдачи, в изданных сборниках документов и научных публикациях.</div>`},
{t:"5.3. Особенности классификации специальных видов документации", c:`<p><strong>Научно-техническая документация (НТД)</strong> классифицируется по объектам и проектам, а не по структурным подразделениям. Основные единицы: проект, объект, стадия проектирования, комплект. Ведущими признаками выступают тематический и объектный; учёт ведётся по комплектам и разделам, применяется инвентарная книга и картотека пообъектного учёта.</p><p><strong>Кино-, фото-, фоно- и видеодокументы</strong> систематизируются по видам носителей (негатив, позитив, магнитная лента, оптический диск), затем по тематическим и хронологическим признакам. Единицы учёта — кадр, сюжет, единица хранения (катушка, кассета), а также «единица учёта» и «единица хранения» различаются. Для них обязательно наличие технологической документации (паспорт записи, содержание), а хранение требует особых температурно-влажностных режимов.</p><p><strong>Картографическая и геодезическая документация</strong> классифицируется по номенклатуре листов, масштабу, территории и дате съёмки; учёт ведётся по инвентарным книгам и листам-паспортам.</p><p><strong>Электронные документы</strong> классифицируются по видам (текстовые, табличные, графические, базы данных, электронные образы), по форматам и метаданным. Важнейшие требования: фиксация формата и версии, наличие описи и контрольных сумм, обеспечение миграции и воспроизводимости, разграничение подлинника электронного документа (с электронной цифровой подписью) и его копии. Электронные образы документов на бумаге — это копии, подлинником остаётся бумажный документ, если иное не установлено законом.</p>
<div class="fact"><span class="cap">Практика оцифровки в Узбекистане</span>В рамках цифровизации, предусмотренной актами Президента и Кабинета Министров Республики Узбекистан и Стратегией «Цифровой Узбекистан — 2030», документы Национального архивного фонда поэтапно оцифровываются, а их образы включаются в электронные каталоги и информационную систему «Архивное дело», что ускоряет обслуживание граждан и исследователей.</div>`},
{t:"5.4. Значение классификации для учёта, каталогизации и организации поиска", c:`<p>Классификация непосредственно определяет качество всех последующих процессов:</p><ul>
<li><strong>учёт</strong> — только упорядоченные фонды поддаются точному учёту и проверке наличия;</li>
<li><strong>каталогизация</strong> — предметно-тематическая и именная классификации лежат в основе каталогов: систематического, именного, географического;</li>
<li><strong>описание</strong> — опись формируется строго по схеме систематизации, поэтому ошибки группировки искажают весь справочный аппарат;</li>
<li><strong>сохранность</strong> — правильно размещённые дела удобны для контроля состояния, реставрации и выдачи;</li>
<li><strong>использование</strong> — скорость и точность исполнения запросов граждан напрямую зависят от логики классификации;</li>
<li><strong>цифровая доступность</strong> — метаданные оцифрованных документов строятся на основе архивного шифра и классификационных признаков.</li></ul>
<p>В условиях цифровизации классификация приобретает новое измерение: традиционные признаки (тема, автор, хронология, география) превращаются в <strong>метаданные</strong> и поисковые поля электронных каталогов. Это позволяет объединить учётные и справочные функции, обеспечить полнотекстовый поиск и удалённый доступ пользователей, сохранив при этом научные принципы фондовой систематизации и провениенции.</p>
<div class="npa"><span class="cap">Вывод по теме</span>Грамотная классификация — это не только соблюдение инструкций, но и профессиональное умение видеть в документальном комплексе историческую логику деятельности фондообразователя. Именно она превращает архив в информационный ресурс государства и общества.</div>`}
],

intro:`<p>Обретение независимости Республики Узбекистан в 1991 году означало начало формирования собственной национальной архивной системы: своего законодательства, понятия «Национальный архивный фонд Республики Узбекистан», сети архивов и профессионального управления. В первой части темы рассматриваются этапы институционального становления (1992–2010 годы), правовой статус Национального архивного фонда и структура архивной службы страны.</p>`,

sections:[
{t:"6.1. Правовые основы и этапы становления национальной архивной системы (1992–2010)", c:`<p>Формирование национальной архивной системы началось с пересмотра нормативно-правовой базы и перестройки управления отраслью. Выделяются следующие этапы:</p><ul>
<li><strong>1992 год</strong> — постановление Кабинета Министров Республики Узбекистан «Об утверждении Положения о Главном архивном управлении при Кабинете Министров Республики Узбекистан (“Узглавархив”) и сети центральных государственных архивов». Управление архивным фондом и архивными учреждениями возложено на «Узглавархив», которому предоставлялось право разрабатывать предложения по обновлению законодательной базы;</li>
<li><strong>15 апреля 1999 года</strong> — принят <strong>Закон Республики Узбекистан «Об архивах»</strong> (№ 761-I) — первый специальный закон в истории независимого Узбекистана. Он ввёл понятие «Национальный архивный фонд Республики Узбекистан», определил правовой статус центральных государственных архивов и ведомственных архивов, порядок государственной регистрации документов НАФ, разграничил полномочия Кабинета Министров и архивного ведомства, установил сроки ведомственного хранения, определил функционирование Государственного каталога НАФ; историческое значение закона — он охватил отношения в сфере архивного дела независимо от форм собственности, включая негосударственные архивы;</li>
<li><strong>2004 год</strong> — постановление Кабинета Министров «О дальнейшем совершенствовании управления архивным делом в Республике Узбекистан»: изменена система органов управления, центральное ведомство получило форму Агентства «Узархив» при Кабинете Министров;</li>
<li><strong>2010 год</strong> — принят <strong>Закон Республики Узбекистан «Об архивном деле»</strong>, уточнивший полномочия Кабинета Министров, Агентства «Узархив» и органов государственной власти на местах, а также состав Национального архивного фонда, включающего государственную и негосударственную части;</li>
<li><strong>2019 год</strong> — Указ Президента Республики Узбекистан от 20 сентября «О мерах по совершенствованию архивного дела и делопроизводства в Республике Узбекистан» и соответствующее постановление Кабинета Министров: образовано <strong>Агентство «Узархив» Республики Узбекистан</strong>, на базе Центрального государственного архива создан <strong>Национальный архив Узбекистана</strong>, определён поэтапный переход к оцифровке документов и предоставлению архивных услуг через центры государственных услуг и Единый портал интерактивных государственных услуг (с 1 июня 2020 года).</li></ul>
<div class="npa"><span class="cap">Логика развития законодательства</span>От «закона об архивах» (о хранилищах) — к «закону об архивном деле» (о деятельности и управлении) и далее — к модели «архив как открытый информационный ресурс государства», что соответствует принципам прозрачности и цифровизации.</div>`},
{t:"6.2. Национальный архивный фонд Республики Узбекистан: понятие, состав, собственность", c:`<p><strong>Национальный архивный фонд Республики Узбекистан (НАФ РУз)</strong> — совокупность архивных документов, отражающих материальную и духовную жизнь общества, имеющих историческое, научное, социальное, экономическое, политическое или культурное значение, независимо от места их хранения и формы собственности. НАФ является составной частью историко-культурного наследия народа Узбекистана и находится под защитой государства.</p><p>Структура НАФ:</p><ul>
<li><strong>государственная часть</strong> — документы государственных органов, организаций и учреждений, а также документы, приобретённые государством, полученные по договорам, депонированные или добровольно переданные собственниками;</li>
<li><strong>негосударственная часть</strong> — документы частных предприятий и организаций, общественных объединений, политических партий, религиозных организаций, фермерских хозяйств, семейных и личных архивов граждан, прошедшие экспертизу ценности и поставленные на государственный учёт. Право собственности на них сохраняется за владельцами, а государство обеспечивает учёт, методическую помощь и защиту документов от утраты.</li></ul>
<p>Основные требования законодательства: сохранение документов НАФ является обязанностью всех физических и юридических лиц; документы НАФ, находящиеся в государственной собственности, как и здания, помещения и оборудование государственных архивов, не подлежат отчуждению; при ликвидации организаций обеспечивается передача документов правопреемникам либо в государственные архивы; собственники обязаны хранить документы в надлежащих условиях и не имеют права уничтожать документы НАФ без согласования с архивным ведомством.</p>
<div class="fact"><span class="cap">Практическое следствие</span>Государственная регистрация документов НАФ негосударственных владельцев с выдачей соответствующего свидетельства (сертификата) позволяет учитывать частные архивы, оказывать им методическую помощь, включать их в Государственный каталог и предотвращать вывоз или утрату ценных документов.</div>`},
{t:"6.3. Система органов управления архивным делом и сеть архивов Республики Узбекистан", c:`<p>Государственное управление архивным делом осуществляет <strong>Агентство «Узархив» Республики Узбекистан</strong> (с 2019 г.), которое отвечает за государственную политику в сфере архивного дела и делопроизводства, нормативное регулирование, координацию деятельности архивов, контроль за сохранностью документов, цифровизацию и международное сотрудничество.</p><p>Сеть архивов включает несколько уровней:</p><ul>
<li><strong>Национальный архив Узбекистана</strong> — центральное хранилище документов высших органов государственной власти, фондов общегосударственного значения;</li>
<li><strong>центральные государственные архивы</strong> — специализированные: исторический архив (документы дореволюционного периода и ранних эпох), архив документации органов власти и управления, архив кинофотофонодокументов, архив научно-технической документации и др.;</li>
<li><strong>областные (Республики Каракалпакстан) и территориальные архивы</strong>, включая межведомственные архивы по личному составу, подчинённые Агентству;</li>
<li><strong>районные и городские государственные архивы</strong> — хранят документы местных органов власти, учреждений, организаций района (города), прежде всего документы по личному составу ликвидированных организаций;</li>
<li><strong>ведомственные и корпоративные архивы</strong> организаций — государственных органов, министерств, ведомств, хозяйственных обществ, банков, вузов, медицинских учреждений; осуществляют хранение документов в пределах установленных сроков ведомственного хранения;</li>
<li><strong>частные (негосударственные) архивы</strong>, архивы общественных объединений и семейные архивы — относятся к негосударственной части НАФ.</li></ul>
<p>Всего в Республике Узбекистан действует более 100 государственных архивов, в которых хранятся миллионы единиц хранения. Архивные услуги (выдача справок о трудовом стаже и заработной плате, подтверждение документов об образовании, предоставление информации по запросам) предоставляются гражданам в том числе через <strong>центры государственных услуг</strong> и <strong>ЕПИГУ</strong>, что резко сокращает сроки исполнения обращений и повышает доступность архивной информации.</p>
<div class="npa"><span class="cap">Местные органы</span>Совет Министров Республики Каракалпакстан, хокимияты областей и города Ташкента обеспечивают организацию архивного дела на своих территориях, содержание зданий и хранилищ, финансирование территориальных архивов в пределах своих полномочий.</div>`},
{t:"6.4. Комплектование архивов и взаимодействие с организациями — источниками комплектования", c:`<p><strong>Комплектование</strong> — систематическое пополнение государственных архивов документами НАФ в соответствии с их профилем. Круг организаций — источников комплектования (списки организаций — источников комплектования) утверждается архивным ведомством и включает органы власти, учреждения, крупные предприятия, организации, документы которых имеют научное и практическое значение.</p><p>Основные направления работы по комплектованию:</p><ul>
<li>изучение истории и деятельности организаций, определение состава документов, подлежащих приёму на постоянное хранение;</li>
<li>методическая помощь организациям в постановке делопроизводства, составлении номенклатуры дел, экспертизе ценности и упорядочении документов;</li>
<li>контроль за соблюдением сроков ведомственного хранения и качеством подготовки документов к передаче;</li>
<li>приём документов по описям (или при их отсутствии — по пофондовым спискам), оформление актов приёма-передачи;</li>
<li>приём документов по личному составу ликвидированных организаций, обеспечивающий социальную защиту граждан;</li>
<li>приём на депозитарное хранение, договорное хранение и добровольная передача документов негосударственных владельцев.</li></ul>
<p>Качество комплектования напрямую зависит от состояния делопроизводства в организациях: правильная номенклатура дел, своевременная экспертиза ценности и научная обработка документов обеспечивают полноценное формирование Национального архивного фонда. Именно поэтому контроль за делопроизводством и архивным делом в организациях является важной функцией Агентства «Узархив» и его территориальных подразделений.</p>`}

intro:`<p>Вторая часть темы посвящена современным направлениям развития архивного дела Республики Узбекистан: совершенствованию законодательства и управленческой модели, цифровизации и внедрению информационной системы «Архивное дело», оказанию электронных услуг, международному сотрудничеству, научной работе и подготовке кадров. Особое внимание уделяется проблемам отрасли и приоритетам на ближайшую перспективу.</p>`,
plan:[
"Реформа управления архивным делом: указ от 20 сентября 2019 года и его последствия",
"Цифровизация архивного дела: информационная система «Архивное дело», электронные документы и услуги",
