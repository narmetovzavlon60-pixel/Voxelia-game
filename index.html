"Проблемы развития отрасли и приоритетные направления на перспективу"
],
sections:[
{t:"7.1. Реформа управления архивным делом: Указ Президента от 20 сентября 2019 года", c:`<p>Указ Президента Республики Узбекистан от 20 сентября 2019 года «О мерах по совершенствованию архивного дела и делопроизводства в Республике Узбекистан» и принятое в его развитие постановление Кабинета Министров определили комплексный характер реформы:</p><ul>
<li>на базе Агентства «Узархив» при Кабинете Министров образовано <strong>Агентство «Узархив» Республики Узбекистан</strong> — самостоятельный орган государственного управления с расширенными полномочиями по контролю в сфере архивного дела и делопроизводства;</li>
<li>на базе Центрального государственного архива создан <strong>Национальный архив Узбекистана</strong> с соответствующим статусом и задачами;</li>
<li>предусмотрено ускорение <strong>оцифровки документов</strong> на бумажных носителях, а также кино-, фото- и фонодокументов;</li>
<li>архивные услуги переведены в <strong>центры государственных услуг</strong> и на <strong>Единый портал интерактивных государственных услуг</strong> (с 1 июня 2020 года выдача справок и предоставление информации осуществляются в электронном виде);</li>
<li>упорядочена передача межведомственных архивов по личному составу в ведение Агентства (соответствующие мероприятия были предусмотрены до 1 марта 2020 года);</li>
<li>усилены требования к организации делопроизводства в государственных органах и организациях, внедряются электронный документооборот и электронные архивы.</li></ul>
<div class="npa"><span class="cap">Смысл реформы</span>Переход от «закрытого хранилища» к модели «архив — сервис»: гражданин должен получать подтверждение своих прав (трудовой стаж, заработная плата, образование, награды) быстро, дистанционно и на законных основаниях, а научное сообщество — удобный доступ к документальному наследию.</div>`},
{t:"7.2. Цифровизация архивного дела: информационная система «Архивное дело», электронные документы и услуги", c:`<p>Цифровизация — ключевое направление развития отрасли. В Республике Узбекистан создана <strong>информационная система «Архивное дело»</strong>, предназначенная для автоматизации архивной деятельности: ведения учёта фондов, каталогов и описей в электронном виде, регистрации запросов и выдачи справок, планирования и контроля работы архивов.</p><p>Основные технологические направления:</p><ul>
<li><strong>оцифровка документов НАФ</strong> — поэтапное создание электронных образов особо востребованных и ценных документов, включая документы по личному составу, фонды по истории края, аудиовизуальные материалы;</li>
<li><strong>электронный учёт</strong> — перевод листов фондов, описей, паспортов архивов и Государственного каталога НАФ в электронные базы данных;</li>
<li><strong>электронный документооборот и электронные архивы</strong> организаций: приём, учёт и хранение электронных документов с электронной цифровой подписью, фиксацией форматов и метаданных;</li>
<li><strong>электронные услуги</strong>: подача запроса через ЕПИГУ, отслеживание статуса обращения, получение справки в электронном виде с юридической силой;</li>
<li><strong>удалённый доступ к каталогам</strong> и веб-ресурсам архивов, публикация виртуальных выставок и документальных коллекций;</li>
<li><strong>обеспечение долгосрочной сохранности</strong> электронных документов: контрольные суммы, резервное копирование, миграция форматов, страховой фонд документации.</li></ul>
<p>Цифровые процессы не отменяют традиционных требований: подлинность, достоверность, целостность и доступность документов должны быть доказуемы. Поэтому при оцифровке сохраняется связь электронного образа с учётными данными (архивным шифром) подлинника, а документы с неудовлетворительным физическим состоянием и особо ценные документы предоставляются пользователям в виде копий.</p>
<div class="fact"><span class="cap">Преимущества цифровизации</span>Сокращение времени исполнения запросов граждан, снижение нагрузки на подлинники (консервация документов), расширение научного доступа, возможность межархивного обмена данными и участия Узбекистана в международных электронных проектах.</div>`},
{t:"7.3. Международное сотрудничество, научно-исследовательская работа и подготовка кадров", c:`<p>Агентство «Узархив» и государственные архивы Республики Узбекистан развивают сотрудничество с международными и региональными организациями: Международным советом архивов (МСА), архивными службами стран СНГ, ЮНЕСКО, национальными архивами зарубежных государств. Основные направления — обмен опытом и нормативными материалами, участие в межгосударственных программах по учёту, хранению и использованию архивных документов, проведение совместных научных конференций и выставок, выявление и копирование документов по истории Узбекистана, хранящихся за рубежом.</p><p>Научная деятельность архивов включает:</p><ul>
<li>составление научных справочников, путеводителей, обзоров фондов, тематических каталогов;</li>
<li>публикацию сборников документов по истории Узбекистана, в том числе по истории независимости, репрессий, эвакуации и тыла в годы войны, деятельности Темуридов;</li>
<li>подготовку документальных выставок, лекций, экскурсий, виртуальных экспозиций, совместных проектов с музеями, библиотеками и средствами массовой информации;</li>
<li>участие в исследованиях по источниковедению, археографии, истории архивного дела, топонимике и генеалогии;</li>
<li>внедрение результатов научной работы в практику: новые методики описания, оцифровки, автоматизированного поиска.</li></ul>
<p>Подготовка специалистов ведётся в системе высшего и среднего специального образования Республики Узбекистан по направлениям «История», «Архивоведение», «Документоведение и архивоведение»; важную роль играют повышение квалификации архивистов, методические семинары Агентства «Узархив», издание учебной литературы на государственном и русском языках, а также знание восточных языков для работы с документами на арабской графике.</p>
<div class="npa"><span class="cap">Документальное наследие</span>Отдельные памятники письменной культуры Узбекистана включены в международный реестр ЮНЕСКО «Память мира» (например, Самаркандский Коран Усмана, 1997 г.), что подчёркивает всемирное значение документального наследия страны.</div>`},
{t:"7.4. Проблемы развития отрасли и приоритетные направления на перспективу", c:`<p>Несмотря на значительные достижения, для архивной отрасли Республики Узбекистан характерен ряд проблем:</p><ul>
<li><strong>материально-технические</strong>: недостаток современных архивохранилищ, высокая изношенность зданий, необходимость соблюдения температурно-влажностного режима, обеспечение безопасности и пожаротушения;</li>
<li><strong>кадровые</strong>: нехватка специалистов, владеющих восточными языками, реставрацией, ИКТ и электронным документооборотом;</li>
<li><strong>технологические</strong>: объёмы оцифровки пока уступают накопленному массиву документов, требуется унификация форматов и метаданных;</li>
<li><strong>методические</strong>: необходимость обновления правил и инструкций с учётом работы с электронными документами;</li>
<li><strong>правовые</strong>: вопросы доступа к документам, содержащим персональные данные, разграничение открытой и ограниченной информации, сроки рассекречивания;</li>
<li><strong>информационные</strong>: недостаточная популярность архивов в обществе, слабое использование архивной информации в образовании и медиа.</li></ul>
<p>Приоритетные направления развития: завершение перехода на электронный учёт и создание единой электронной базы Государственного каталога НАФ; ускоренная оцифровка документов по личному составу и социально значимых фондов; строительство и модернизация архивохранилищ; формирование страхового фонда копий особо ценных документов; развитие корпоративных (ведомственных) архивов и электронного документооборота; системная популяризация архивного наследия; укрепление международного сотрудничества.</p>
<div class="fact"><span class="cap">Перспектива</span>В стратегических документах Республики Узбекистан архивная информация рассматривается как государственный информационный ресурс: доступность архивов напрямую влияет на качество госуслуг, инвестиционный климат и историческое самосознание общества.</div>`}
],

id:8, module:"Модуль V. Экспертиза ценности документов и комплектование архивов",
title:"Экспертиза ценности документов. Приём документов в государственные архивы. Часть 1", hours:2,
tags:["экспертиза ценности","критерии","ЭК","ЭПК","номенклатура дел","акт о выделении к уничтожению"],
intro:`<p>Экспертиза ценности — центральная и наиболее ответственная архивная процедура: именно на её основании решается, какие документы должны сохраняться вечно, какие — длительно, а какие могут быть уничтожены как утратившие практическое и научное значение. Ошибка при экспертизе означает либо невосполнимую утрату исторической памяти, либо избыточные расходы на хранение малоценных документов. В первой части темы рассматриваются понятие, принципы, критерии и организационная структура экспертизы.</p>`,
plan:[

sections:[
{t:"8.1. Понятие, задачи и принципы экспертизы ценности документов", c:`<p><strong>Экспертиза ценности документов</strong> — научно обоснованное изучение состава и содержания документов с целью определения их политического, научного, практического, социального и культурного значения и принятия решения о сроках и форме хранения (постоянное хранение, длительное хранение, уничтожение).</p><p><strong>Задачи экспертизы:</strong></p><ul>
<li>отбор документов, имеющих ценность для Национального архивного фонда Республики Узбекистан, и включение их в состав фондов государственных архивов;</li>
<li>определение документов длительного хранения (свыше 10 лет), необходимых для практического использования, в первую очередь документов по личному составу;</li>
<li>выявление документов с повторяющейся информацией, подлежащих уничтожению;</li>
<li>обеспечение полноты состава архивного фонда и устранение дублирования между фондами;</li>
<li>обоснование стоимости и объёма хранения, оптимизация работы архивов и организаций.</li></ul>
<p><strong>Принципы экспертизы:</strong></p><ul>
<li><strong>историзм</strong> — оценка документов в контексте эпохи и деятельности фондообразователя;</li>
<li><strong>всесторонность и комплексность</strong> — оценка документов в комплексе, а не каждого в отдельности;</li>
<li><strong>народно-хозяйственная (общественная) значимость</strong> — приоритет интересов общества и государства перед узкоорганизационными;</li>
<li><strong>законность</strong> — уничтожение документов только в установленном порядке, с оформлением акта и согласования;</li>
<li><strong>необратимость решения</strong> — уничтоженные документы не восстанавливаются, поэтому процедура требует особой осторожности.</li></ul>
<div class="npa"><span class="cap">Правовая норма</span>Уничтожение документов Национального архивного фонда без согласования с архивным ведомством не допускается. Документы, имеющие ценность для граждан (по личному составу), сохраняются независимо от практической значимости для организации.</div>`},
{t:"8.2. Система критериев оценки ценности документов", c:`<p>Критерии экспертизы ценности — научно обоснованные признаки, на основе которых определяется значение документов. Они делятся на три основные группы:</p><p><strong>1. Критерии происхождения:</strong></p><ul>
<li>значимость учреждения или лица — фондообразователя в системе управления, науки, культуры;</li>
<li>значимость события, отражённого в документе;</li>
<li>время и место образования документов;</li>
<li>принадлежность к определённому архивному фонду (принцип провениенции).</li></ul>
<p><strong>2. Критерии содержания:</strong></p><ul>
<li>значимость содержания (уникальность, новизна информации, отражение важных сторон деятельности);</li>
<li>вид и разновидность документа (приказ, протокол, отчёт, переписка, чертёж, личное письмо);</li>
<li>повторяемость информации (документ, повторяющийся в нескольких экземплярах или фондах, ценится ниже подлинника);</li>
<li>юридическая сила документа (подлинник, копия, дубликат, заверенный документ);</li>
<li>целевое назначение и авторство документа.</li></ul>
<p><strong>3. Критерии внешних особенностей:</strong></p><ul>
<li>подлинность и физическое состояние документа;</li>
<li>особенности оформления (подписи, печати, каллиграфия, миниатюры, автографы);</li>
<li>художественная, культурная, материальная ценность носителя (документы на бумаге ручного производства, фотографии, грамоты);</li>
<li>особенности использования (востребованность в научно-исследовательской и справочной работе).</li></ul>
<p>Для документов по личному составу действует специфический критерий — <strong>социально-правовая значимость</strong>: документы, подтверждающие стаж, заработок, образование, семейное положение и права граждан, хранятся длительно (как правило, 75 лет), так как затрагивают конкретные судьбы людей.</p>
<div class="fact"><span class="cap">Практическая тонкость</span>Одинаковые по номиналу документы могут иметь разную ценность: подлинный ферман бухарского эмира, автограф учёного, негатив фотодокумента имеют самостоятельную ценность, тогда как их копии оцениваются как справочный материал.</div>`},
{t:"8.3. Организационная структура экспертизы: ЭК организаций, ЦЭК, ЭПК", c:`<p>Экспертиза ценности проводится постоянно действующими органами, различающимися по уровню и полномочиям:</p><ul>
<li><strong>Экспертная комиссия (ЭК) организации</strong> — создается приказом руководителя; рассматривает номенклатуру дел, описи дел постоянного и длительного хранения, акты о выделении документов к уничтожению, определяет методику экспертизы в организации;</li>
<li><strong>Центральная экспертная комиссия (ЦЭК)</strong> — в министерствах, ведомствах, крупных объединениях; координирует работу ЭК подведомственных организаций и рассматривает сводные описи и акты;</li>
<li><strong>Экспертно-проверочная комиссия (ЭПК) архивного ведомства (Агентства «Узархив» и его территориальных подразделений)</strong> — орган государственного контроля: утверждает (соглашает) описи дел постоянного хранения, разрешает уничтожение документов, принимает решения о включении фондов в состав НАФ, устанавливает состав организаций — источников комплектования;</li>
<li><strong>Экспертные комиссии государственных архивов</strong> — рассматривают результаты экспертизы при упорядочении и обработке фондов, вопросы особо ценных документов, пересмотра сроков хранения.</li></ul>
<p>Комиссии работают на заседаниях с протоколированием решений. В состав комиссий включаются представители руководства, делопроизводственной службы, архива, а также специалисты по направлениям деятельности. Решения ЭК вступают в силу после утверждения руководителем организации, а решения об уничтожении — после согласования с ЭПК архивного ведомства.</p>
<div class="npa"><span class="cap">Разграничение полномочий</span>ЭК организации принимает решение «внутри» организации; ЭПК — государственный орган, определяющий судьбу документов НАФ. Именно поэтому акт о выделении к уничтожению не подлежащих хранению документов вступает в силу только после утверждения описей и согласования ЭПК.</div>`},
{t:"8.4. Методика проведения экспертизы и оформление её результатов", c:`<p>Экспертиза ценности проводится, как правило, ежегодно в конце делопроизводственного года, а также при подготовке документов к передаче в архив, при ликвидации или реорганизации организации. Методика включает следующие этапы:</p><ul>
<li><strong>подготовительный</strong>: изучение истории организации, номенклатуры дел, перечней документов с указанием сроков хранения, прежних описей;</li>
<li><strong>полистный (пофондовый) просмотр дел</strong>: дела просматриваются полностью — оценка «по заголовкам» не допускается; проверяются сохранность, нумерация листов, наличие внутренних описей;</li>
<li><strong>группировка дел</strong> по срокам хранения: постоянного, длительного, временного;</li>
<li><strong>составление описей</strong> дел постоянного и длительного хранения (по установленной форме с заголовками, датами, номерами дел и листов описи);</li>
<li><strong>составление акта о выделении к уничтожению</strong> документов, не подлежащих хранению, с указанием заголовков, дат, номеров дел и оснований отбора;</li>
<li><strong>рассмотрение на ЭК/ЦЭК</strong> и согласование в ЭПК;</li>
<li><strong>уничтожение</strong> документов, оформленное актом с отметкой о сжигании/переработке, и внесение изменений в учётные документы.</li></ul>
<p>Итоговые документы экспертизы: описи дел (постоянного хранения, по личному составу), акты о выделении к уничтожению, акты о неисправимых повреждениях документов, протоколы заседаний комиссий, историческая справка. Особо ценные документы с неудовлетворительным физическим состоянием могут быть переданы на реставрацию, а при невозможности восстановления — оформляется акт о неисправимых повреждениях с решением о судьбе документа.</p>
<div class="fact"><span class="cap">Типичные ошибки</span>Уничтожение документов без акта; отбор «по заголовкам» без полистного просмотра; уничтожение документов по личному составу; смешивание дел разных фондообразователей; отсутствие протоколов ЭК — все они нарушают законность и приводят к утрате документов НАФ.</div>`}
],

intro:`<p>Вторая часть темы раскрывает нормативные инструменты экспертизы (перечни документов со сроками хранения, номенклатуры дел), порядок защиты документов по личному составу при ликвидации организаций, а также технологию приёма документов в государственные архивы и их постановку на государственный учёт. Отдельно рассматривается работа с особо ценными документами и создание страхового фонда копий.</p>`,

sections:[
{t:"9.1. Нормативная основа экспертизы: перечни документов со сроками хранения и номенклатура дел", c:`<p>Основным инструментом, обеспечивающим единообразие экспертизы, являются <strong>перечни документов с указанием сроков хранения</strong> — нормативные справочники, в которых по видам и вопросам деятельности установлены сроки хранения: постоянное хранение, длительное хранение (свыше 10 лет), хранение в течение определённого числа лет. Перечни разрабатываются архивным ведомством с участием заинтересованных министерств и периодически пересматриваются с учётом появления новых видов документации (электронные документы, цифровая отчётность, медиаматериалы).</p><p><strong>Номенклатура дел</strong> — систематизированный перечень заголовков дел, заводимых в организации, с указанием сроков их хранения и индексов. Она выполняет три функции:</p><ul>
<li>учётную — закрепляет структуру делопроизводства за год;</li>
<li>классификационную — определяет порядок распределения и группировки исполненных документов в дела;</li>
<li>сроковую — устанавливает сроки хранения, переносимые из перечней.</li></ul>
<p>Номенклатура дел составляется службой делопроизводства при участии архива и экспертной комиссии, согласовывается с ЭПК архивного ведомства и утверждается руководителем организации; пересматривается ежегодно. Именно номенклатура дел связывает делопроизводство с архивной технологией: от её качества зависит, попадут ли ценные документы в дела и будут ли они правильно описаны.</p>
<div class="npa"><span class="cap">Типовые сроки</span>Для документов по личному составу (приказы, личные карточки, лицевые счета, трудовые договоры) обычно устанавливается срок хранения 75 лет; для планово-отчётной документации высших и центральных органов — постоянное хранение; для бухгалтерской и оперативной документации — ограниченные сроки (от 1 до 10 лет), после чего проводится экспертиза.</div>`},
{t:"9.2. Обеспечение сохранности документов при реорганизации и ликвидации организаций", c:`<p>Реорганизация, банкротство и ликвидация организаций — период наибольшего риска утраты документов. Законодательство Республики Узбекистан возлагает обязанность обеспечить сохранность и передачу документов:</p><ul>
<li>при реорганизации документы передаются правопреемнику в порядке, определяемом передаточным актом;</li>
<li>при ликвидации документы постоянного хранения и документы по личному составу передаются в государственные архивы либо в архивы организаций-правопреемников, а документы временных сроков хранения уничтожаются после экспертизы;</li>
<li>ликвидационная комиссия обязана провести упорядочение документов, составить описи и акты, определить место дальнейшего хранения;</li>
<li>документы по личному составу должны быть переданы в установленном порядке независимо от имущественных вопросов банкротства, поскольку они необходимы гражданам для подтверждения трудового стажа и пенсионных прав.</li></ul>
<p>Архивное ведомство контролирует этот процесс: даёт методические указания, проверяет качество упорядочения, принимает документы. В отдельных случаях, когда документы не могут быть приняты государственным архивом (отсутствие места, профильное несоответствие), они хранятся у правопреемника или в специально определённой организации с обязательным информированием архивного ведомства.</p>
<div class="fact"><span class="cap">Социальное значение</span>Запросы граждан о подтверждении стажа и заработной платы за прошлые годы — одна из самых массовых категорий обращений в архивы Узбекистана. Именно документы по личному составу ликвидированных предприятий обеспечивают реализацию пенсионных и социальных прав людей.</div>`},
{t:"9.3. Технология приёма документов в государственные архивы и их постановка на государственный учёт", c:`<p>Приём документов в государственный архив включает подготовительный, приёмный и учётный этапы.</p><p><strong>1. Подготовка документов организацией — источником комплектования:</strong> проведение экспертизы ценности, составление описей дел постоянного хранения и описей по личному составу, согласование описей в ЭПК, формирование научно-справочного аппарата, составление исторической справки о фондообразователе, физическая подготовка дел (переплёт, подшивка, нумерация листов, обложки).</p><p><strong>2. Приём документов:</strong></p><ul>
<li>проверка правильности научно-технической обработки: заголовки, даты, нумерация, состояние дел;</li>
<li>количественная проверка — сличение фактического числа дел с описью;</li>
<li>качественная (полистная) проверка выборочно или полностью — выявление отсутствующих листов и документов;</li>
<li>оформление <strong>акта приёма-передачи документов</strong> и передача описей;</li>
<li>при обнаружении дефектов составляется акт, а организация устраняет недостатки и повторно представляет документы.</li></ul>
<p><strong>3. Постановка на государственный учёт:</strong> присвоение фонду номера в валовой последовательности, заполнение <strong>листа фонда</strong>, карточки фонда, внесение записи в <strong>книгу учёта поступлений</strong> и <strong>книгу учёта фондов</strong>, создание <strong>дела фонда</strong>, включение сведений в паспорт архива и в Государственный каталог НАФ. Документы по личному составу учитываются отдельно, с присвоением соответствующих индексов, что облегчает обслуживание граждан.</p>
<div class="npa"><span class="cap">Учётная дисциплина</span>Все изменения состава и объёма фондов (поступление, выбытие, объединение, разделение фондов, обнаружение неучтённых документов) должны быть одновременно отражены во всех учётных документах архива — это основа достоверности государственного учёта.</div>`},
{t:"9.4. Работа с особо ценными документами и создание страхового фонда копий", c:`<p><strong>Особо ценные документы</strong> — документы, имеющие непреходящее культурно-историческое значение, уникальные или незаменимые по содержанию, утрата которых невосполнима. К ним относятся памятники письменной культуры, документы о ключевых событиях истории, автографы выдающихся людей, ранние фотодокументы, карты и планы, документы с художественным оформлением.</p><p>Работа с ними включает:</p><ul>
<li>выявление и <strong>выделение особо ценных документов</strong> в фонде с составлением перечня (реестра) и учётом в отдельной картотеке;</li>
<li>создание <strong>фонда пользования</strong>: копий на плёночных или цифровых носителях, что позволяет не выдавать подлинники;</li>
<li>создание <strong>Государственного страхового фонда копий документов</strong> — совокупности копий, хранящейся отдельно от подлинников (в том числе в другом регионе), предназначенной для возмещения возможных утрат;</li>
<li>особый режим хранения: отдельные хранилища или боксы, строгий температурно-влажностный режим, ограничение доступа, учёт каждого обращения;</li>
<li>при необходимости — реставрация и консервация, копирование для исследователей вместо выдачи подлинников.</li></ul>
<p>Ответственность за сохранность документов Национального архивного фонда несут руководители архивов и организаций. Должностные лица, допустившие уничтожение, хищение, утрату или повреждение документов НАФ, привлекаются к ответственности в соответствии с законодательством Республики Узбекистан (включая административную и уголовную ответственность).</p>
<div class="npa"><span class="cap">Международный опыт</span>Создание страховых копий и фонда пользования — общемировая практика: она сочетает сохранность подлинников с максимальной доступностью информации, что особенно важно при оцифровке и предоставлении документов в удалённом доступе.</div>`}

intro:`<p>Документы становятся доступными только тогда, когда к ним создан научно-справочный аппарат. НСА — это комплекс взаимосвязанных учётных и справочных документов, обеспечивающих поиск информации о документах и самих документов. В первой части темы рассматриваются понятие и система НСА, учётные документы, а также главные справочные формы — опись, путеводитель, каталог и картотека.</p>`,

sections:[
{t:"10.1. Понятие, назначение, принципы построения и система НСА", c:`<p><strong>Научно-справочный аппарат (НСА)</strong> — совокупность взаимосвязанных и взаимодополняющих документов, создаваемых для обеспечения учёта, сохранности и использования архивных документов. Назначение НСА — двоякое: во-первых, он служит инструментом поиска конкретной информации; во-вторых, он раскрывает состав и содержание документального наследия для общества.</p><p>Принципы построения НСА:</p><ul>
<li><strong>взаимосвязанность и взаимодополняемость</strong> — учётные и справочные документы не дублируют, а дополняют друг друга;</li>
<li><strong>единая терминология и методология</strong> — одинаковое написание наименований фондообразователей, тематических рубрик, географических названий;</li>
<li><strong>динамичность</strong> — возможность оперативного внесения изменений при пополнении фондов;</li>
<li><strong>экономичность</strong> — разумное соотношение затрат на создание справочников и их эффективности;</li>
<li><strong>доступность</strong> — соответствие форм справочников потребностям пользователей.</li></ul>
<p>Система НСА делится на:</p><ul>
<li><strong>учётные документы</strong> — обеспечивают учёт и определение местонахождения документов (опись, лист фонда, карточка фонда, книга учёта поступлений, дело фонда, паспорт архива);</li>
<li><strong>справочные документы</strong> — обеспечивают поиск информации по содержанию (каталоги, картотеки, путеводители, указатели, обзоры, тематические перечни, аннотированные реестры описей);</li>
<li><strong>автоматизированный НСА</strong> — электронные базы данных, электронные каталоги, интернет-ресурсы архивов.</li></ul>
<div class="fact"><span class="cap">Основная единица поиска</span>Базовой адресной единицей НСА является архивный шифр: номер фонда, номер описи, номер дела, номер листа. Без единого шифра невозможно ни точное исполнение запросов, ни научная ссылка на источник.</div>`},
{t:"10.2. Учётные документы НСА", c:`<p>Учётные документы создаются в каждом архиве по установленным формам и обеспечивают точное знание состава и объёма фондов.</p><ul>
<li><strong>Опись дел (документов)</strong> — основной учётный и справочный документ, закрепляющий систематизацию дел и содержащий сведения о каждом деле (номер, заголовок, даты, количество листов).</li>
<li><strong>Лист фонда</strong> — фиксирует наименование фондообразователя, крайние даты документов, количество описей, дел и единиц хранения, все изменения состава фонда.</li>
<li><strong>Карточка (лист) фонда</strong> — сводная учётная карточка для централизованного учёта фондов архива.</li>
<li><strong>Книга учёта поступлений</strong> — регистрирует каждое поступление документов с указанием источника, количества и даты.</li>
<li><strong>Книга учёта фондов (список фондов)</strong> — перечень всех фондов архива с присвоенными номерами.</li>
<li><strong>Дело фонда</strong> — комплекс документов по истории и учёту фонда (историческая справка, схема систематизации, акты, листы проверок наличия и состояния дел).</li>
<li><strong>Паспорт архива</strong> — ежегодный сводный документ о состоянии архива, объёме фондов, наличии и состоянии дел, направляемый в архивное ведомство.</li>
<li><strong>Реестр (список) описей</strong>, <strong>лист-заместитель дела</strong>, <strong>книга выдачи дел</strong> — вспомогательные учётные формы.</li></ul>
<p>Учётные документы должны быть актуальными: любое изменение состава фонда (поступление, выбытие, объединение, переработка описей, обнаружение неучтённых документов) требует одновременного внесения изменений во все связанные документы. На этой основе строится достоверность государственного учёта Национального архивного фонда.</p>`},
{t:"10.3. Опись дел (документов): структура, заголовки, порядок составления и согласования", c:`<p><strong>Опись</strong> — архивный справочник, содержащий систематизированный перечень единиц хранения и предназначенный для их учёта и закрепления систематизации. Опись — одновременно учётный документ и важнейший источник информации о составе фонда.</p><p>Структура описи: <strong>титульный лист</strong> (наименование архива и фонда, номер описи, название, крайние даты); <strong>содержание</strong> (оглавление); <strong>описательные статьи</strong> (графы: номер по порядку, архивный номер дела, заголовок дела, крайние даты, количество листов); <strong>итоговая запись</strong> (число дел, зарегистрированных и пропущенных номеров); <strong>справочные данные</strong>; подписи составителя и заведующего архивом.</p><p>Требования к <strong>заголовкам дел</strong>: точность, полнота, краткость, единообразие формулировок. Заголовок содержит: вид документа (приказы, протоколы, планы, отчёты, переписка), автора или корреспондента (если необходимо), вопрос или содержание, территорию (при необходимости), крайние даты. Нельзя применять неопределённые формулировки («разные документы», «материалы по общим вопросам»).</p><p>Порядок составления и согласования: опись составляется в организации при упорядочении дел, подписывается составителем и руководителем, согласовывается экспертной комиссией организации и утверждается (соглашается) экспертно-проверочной комиссией архивного ведомства; после утверждения опись становится учётным документом государственного архива. Число описей в фонде отражается в листе фонда.</p>
<div class="npa"><span class="cap">Значение описи</span>Опись — «визитная карточка» фонда: по ней определяют, стоит ли запрашивать дело, планируют оцифровку, составляют тематические перечни и каталоги. Качество заголовков прямо определяет качество поиска.</div>`},
{t:"10.4. Каталоги и картотеки: виды и методика каталогизации", c:`<p><strong>Каталог</strong> — межфондовый архивный справочник, в котором информация о содержании документов сгруппирована по определённым признакам и снабжена архивными шифрами. Каталог позволяет искать информацию независимо от принадлежности документов к конкретному фонду — это его принципиальное отличие от описи.</p><p>Основные виды каталогов:</p><ul>
<li><strong>систематический</strong> — по отраслям знаний и тематическим разделам (отрасли экономики, право, культура, образование, исторические периоды);</li>
<li><strong>предметно-тематический</strong> — по темам и подтемам внутри отраслей, с рубриками и подрубриками;</li>
<li><strong>именной</strong> — по фамилиям и именам лиц, упоминаемых в документах (государственные деятели, учёные, репрессированные, участники событий);</li>
<li><strong>географический</strong> — по административно-территориальным единицам и географическим объектам (области, районы, города, реки, каналы);</li>
<li><strong>специальные каталоги</strong> — по отдельным видам документов (картографические, фотодокументы, документы НТД) или по отраслевым темам.</li></ul>
<p>Каталогизация включает следующие этапы: выбор темы и определение группы фондов; выявление документов (по описям, заголовкам, а при необходимости — полистно); составление <strong>каталожных карточек</strong> (на документ, дело, группу дел или фонд) с заголовком, датой, аннотацией и архивным шифром; систематизация карточек по схеме каталога; заполнение и ведение каталога; учёт заполняемости и модернизация.</p>
<p><strong>Картотека</strong> — разновидность каталога, ведущегося на карточках и, как правило, ограниченного по теме или фондовому составу (картотека документов по личному составу, тематическая картотека, картотека фотодокументов). Картотеки удобны для оперативного пополнения и последующего преобразования в электронные базы данных.</p>
<div class="fact"><span class="cap">Переход к электронным каталогам</span>В современных условиях картотеки и каталоги переводятся в электронные базы данных: вместо карточек создаются записи с полями (тема, автор, дата, география, шифр), что обеспечивает полнотекстовый поиск, фасетную фильтрацию и дистанционный доступ пользователей.</div>`}
],

sections:[
{t:"11.1. Обзорные справочники: путеводители, обзоры, указатели", c:`<p>Обзорные справочники предназначены для широкого информирования о составе документального наследия и ориентирования исследователей.</p><ul>
<li><strong>Путеводитель по архиву</strong> — справочник, систематизирующий сведения о фондах архива: наименование фонда, справочные данные о фондообразователе, крайние даты, объём, аннотация состава и содержания документов, указание НСА. Различают путеводители по архиву, по фондам определённой тематики, по группе архивов (сводный путеводитель).</li>
<li><strong>Краткий справочник (список фондов)</strong> — перечень фондов с минимальными сведениями, используемый как оперативное средство ориентирования.</li>
<li><strong>Обзор (тематический обзор)</strong> — справочник, раскрывающий состав и содержание документов по определённой теме с группировкой по фондам и характеристикой их информационного потенциала; содержит научно-справочный аппарат и указатели.</li>
<li><strong>Указатель</strong> — справочник, систематизирующий сведения о документах по именному, географическому, предметно-тематическому или хронологическому признаку (именной указатель, указатель учреждений, топонимический указатель).</li>
<li><strong>Аннотированный реестр описей</strong> — перечень описей фонда с аннотациями их содержания.</li>
<li><strong>Тематические перечни и перечни документов</strong> — списки документов по конкретной теме, подготовленные для исследовательских и издательских проектов.</li></ul>
<p>К обзорным справочникам предъявляются требования научной достоверности, полноты охвата, единства терминологии, наличия научно-справочного аппарата (вступительная статья, указатели, список сокращений). При подготовке изданий на нескольких языках (узбекский, русский, английский) особенно важна точность транслитерации названий фондообразователей и географических объектов.</p>`},
{t:"11.2. Автоматизированный НСА: электронные каталоги, базы данных, интернет-ресурсы", c:`<p>Автоматизация коренным образом меняет организацию НСА: карточные формы уступают место базам данных, а поиск становится мгновенным и удалённым.</p><p>Основные формы:</p><ul>
<li><strong>электронный каталог</strong> — база данных с полями для тем, имён, географии, дат и архивных шифров, поддерживающая полнотекстовый и фасетный поиск;</li>
<li><strong>электронные описи</strong> — массивы заголовков дел с возможностью фильтрации и выгрузки;</li>
<li><strong>базы данных по личному составу</strong> — обеспечивают быстрое исполнение запросов граждан о стаже и заработной плате;</li>
<li><strong>базы данных аудиовизуальных документов</strong> — с изображениями и метаданными;</li>
<li><strong>интернет-ресурсы архивов</strong> — сайты с информацией о фондах, каталогами, виртуальными выставками, онлайн-заявками;</li>
<li><strong>информационная система «Архивное дело»</strong> — государственная система, объединяющая учёт, каталогизацию, исполнение запросов и контроль деятельности архивов;</li>
<li><strong>Государственный каталог НАФ РУз</strong> — сводная база данных о фондах всех государственных архивов.</li></ul>
<p>Требования к автоматизированному НСА: единые методики описания и словари рубрик, обязательная фиксация архивного шифра, защита персональных данных, резервное копирование, версионность, обеспечение долгосрочной доступности. Электронные образы документов связываются с учётными записями, что позволяет исследователю увидеть документ, не заказывая подлинник, и защищает оригинал от износа.</p>
<div class="fact"><span class="cap">Практический эффект</span>Электронный каталог позволяет сократить время исполнения запроса с недель до часов, снизить количество необоснованных заказов дел и повысить полноту поиска за счёт межфондового охвата.</div>`},
{t:"11.3. Организация методической работы по созданию и модернизации НСА", c:`<p>Создание НСА — постоянная, планово организованная работа. Она осуществляется на основе перспективных и годовых планов архивов, утверждаемых руководством и согласовываемых с архивным ведомством.</p><p>Основные направления методической работы:</p><ul>
<li>разработка и обновление схем систематизации, рубрикаторов, словарей наименований учреждений и географических названий;</li>
<li>совершенствование описей: переработка старых описей, составление новых, устранение недостатков заголовков;</li>
<li>создание и пополнение каталогов, картотек, баз данных; определение приоритетных тем с учётом спроса пользователей;</li>
<li>методическое руководство ведомственными архивами и организациями — источниками комплектования (инструктажи, семинары, проверка);</li>
<li>издание справочников, путеводителей, сборников документов; подготовка научно-справочного аппарата к публикациям;</li>
<li>подготовка кадров: обучение правилам описания, терминологии, работы с электронными системами;</li>
<li>учёт и контроль: регистрация заполнения каталогов, ведение журналов использования, оценка объёмов выполненной работы.</li></ul>
<p>Приоритеты определяются по двум критериям: <strong>востребованность</strong> (какие темы и фонды чаще запрашивают граждане и исследователи) и <strong>уязвимость</strong> (документы в плохом физическом состоянии, подлежащие приоритетной оцифровке).</p>`},
{t:"11.4. Оценка эффективности НСА и качества обслуживания пользователей", c:`<p>Эффективность НСА оценивается показателями, отражающими как техническое состояние справочников, так и качество обслуживания:</p><ul>
<li><strong>полнота поиска</strong> — отношение числа найденных релевантных документов к общему их числу по теме;</li>
<li><strong>точность поиска</strong> — отношение релевантных документов к числу выданных;</li>
<li><strong>оперативность</strong> — время исполнения запроса, время выдачи дел в читальном зале;</li>
<li><strong>охват каталогизацией</strong> — доля фондов и единиц хранения, отражённых в каталогах и базах данных;</li>
<li><strong>заполняемость каталога</strong> — соотношение количества карточек (записей) и планируемого объёма;</li>
<li><strong>востребованность</strong> — число пользователей, запросов, посещений читального зала, обращений через ЕПИГУ;</li>
<li><strong>качество описания</strong> — доля заголовков, не требующих уточнения, количество ошибок, выявленных при проверках.</li></ul>
<p>Для анализа используются журналы и листы использования документов, статистические отчёты, опросы пользователей. Результаты анализа служат основой для корректировки планов каталогизации, модернизации рубрикаторов и развития электронных услуг.</p>
<div class="npa"><span class="cap">Вывод по теме</span>НСА — это «интерфейс» Национального архивного фонда: именно через него документальное наследие становится доступным обществу. Современный НСА сочетает традиционные архивные справочники с электронными базами данных и удалёнными сервисами.</div>`}
],

intro:`<p>Использование архивных документов — заключительный и общественно значимый этап архивной технологии, ради которого и осуществляется вся предшествующая работа: комплектование, экспертиза, учёт, хранение и создание НСА. Лекция раскрывает цели и формы использования, порядок исполнения запросов граждан и организаций, работу читальных залов, культурно-просветительскую деятельность, а также правовые ограничения доступа к документам.</p>`,
plan:[

],
sections:[
{t:"12.1. Понятие, цели, задачи и формы использования архивных документов", c:`<p><strong>Использование архивных документов</strong> — деятельность по предоставлению пользователям документов и содержащейся в них информации для удовлетворения информационных, научных, практических, правовых, культурно-просветительских и образовательных потребностей.</p><p><strong>Цели использования:</strong> обеспечение прав и законных интересов граждан; информационное обеспечение государственного управления; научное изучение истории; формирование исторического сознания и национальной идентичности; культурно-просветительская работа; поддержка образования и культуры.</p><p><strong>Основные формы использования:</strong></p><ul>
<li>исполнение запросов физических и юридических лиц (социально-правовых, тематических, генеалогических, имущественных);</li>
<li>работа пользователей в читальном зале архива;</li>
<li>предоставление документов во временное пользование организациям (по актам);</li>
<li>инициативное информирование органов власти и учреждений о документах по актуальным темам;</li>
<li>подготовка документальных выставок, экскурсий, встреч, лекций;</li>
<li>публикация документов в сборниках, научных изданиях, средствах массовой информации и в интернете;</li>
<li>предоставление копий документов и справок;</li>
<li>использование документов в кинематографии, документалистике, музейных экспозициях.</li></ul>
<div class="fact"><span class="cap">Принцип равного доступа</span>Пользователи имеют равные права на доступ к открытым документам независимо от происхождения, социального, должностного и имущественного положения, пола, национальности, языка, отношения к религии и убеждений.</div>`},
{t:"12.2. Исполнение запросов: виды, порядок, сроки и формы выдачи информации", c:`<p><strong>Запрос</strong> — обращение физического или юридического лица в архив с целью получения информации о документах. Основные виды запросов:</p><ul>
<li><strong>социально-правовые</strong> — о трудовом стаже, заработной плате, наградах, учёбе, реабилитации, правах на недвижимость, семейном положении;</li>
<li><strong>тематические</strong> — по научным, учебным, публицистическим темам;</li>
<li><strong>генеалогические</strong> — о родословии, семейной истории;</li>
<li><strong>имущественные и кадастровые</strong> — о правах на землю, строения, о технической документации;</li>
<li><strong>запросы органов власти</strong> — в рамках государственного управления и судебных процедур.</li></ul>
<p>Порядок исполнения: регистрация обращения в установленном законом порядке (обращения физических и юридических лиц рассматриваются в сроки, определённые Законом Республики Узбекистан «Об обращениях физических и юридических лиц»); изучение вопроса и определение фондов; поиск по НСА; просмотр документов; составление <strong>архивной справки</strong>, <strong>архивной копии</strong> или <strong>архивной выписки</strong>.</p><p>Требования к оформлению результатов: точное указание архивного шифра каждого документа, дословность цитирования, указание наименования архива, подпись руководителя и исполнителя, печать. При отсутствии документов в справке указываются причины (отсутствие фонда, отсутствие сведений, утрата документов) с подтверждением проведённой работы.</p>
<div class="npa"><span class="cap">Юридическая сила</span>Архивная справка, оформленная в установленном порядке, является официальным документом и принимается органами власти, судами, банками, пенсионными и нотариальными учреждениями как подтверждение фактов, содержащихся в архивных документах.</div>`},
{t:"12.3. Работа читальных залов, информирование, выставочная и издательская деятельность", c:`<p><strong>Читальный зал</strong> — структурное подразделение архива, обеспечивающее работу исследователей и граждан с документами. Организация работы включает: регистрацию пользователей и оформление личных дел, принятие заказов на дела, выдачу документов под расписку, контроль правил работы (запрет выноса, пометок, фотографирования без разрешения), учёт использования (листы и журналы использования), предоставление копий и цифровых образов.</p><p><strong>Информационная работа</strong> архива включает инициативное информирование органов власти о документах по актуальным вопросам, подготовку тематических обзоров и подборок, участие в подготовке государственных программ, юбилейных мероприятий, учебников и монографий.</p><p><strong>Выставочная и культурно-просветительская деятельность:</strong></p><ul>
<li>стационарные и передвижные документальные выставки;</li>
<li>виртуальные выставки и онлайн-проекты, публикация оцифрованных коллекций;</li>
<li>экскурсии в архивохранилища, дни открытых дверей, встречи с исследователями;</li>
<li>совместные проекты с музеями, библиотеками, вузами и СМИ;</li>
<li>издание сборников документов, справочников, научно-популярных изданий, календарей, альбомов.</li></ul>
<p>При подготовке выставок и изданий соблюдается порядок работы с подлинниками: используются копии или обеспечивается особый режим экспонирования, осуществляется согласование тематики, а также указываются место хранения документов и их архивные шифры в экспозиционных и издательских материалах.</p>`},
{t:"12.4. Правовые основы и ограничения доступа; ответственность за использование", c:`<p>Доступ к документам Национального архивного фонда регулируется законодательством Республики Узбекистан об архивах, об информации, о защите персональных данных, о государственной тайне и о transparency (прозрачности) информации. Ограничения доступа применяются к:</p><ul>
<li>документам, содержащим государственную тайну и секретные сведения;</li>
<li>документам, содержащим персональные данные, доступ к которым ограничен (в том числе сведения о личной и семейной тайне, здоровье, судимости);</li>
<li>документам, содержащим коммерческую или иную охраняемую законом тайну;</li>
<li>документам в неудовлетворительном физическом состоянии и особо ценным подлинникам — вместо них предоставляются копии;</li>
<li>документам, находящимся на реставрации, в фонде пользования отсутствуют копии и т. п.</li></ul>
<p>Пользователи обязаны: обеспечивать сохранность выданных документов; не выносить их за пределы читального зала; не делать пометок и не повреждать; не фальсифицировать и не искажать содержание; при публикации указывать место хранения документа и его владельца. За нарушение правил предусмотрена ответственность в соответствии с законодательством, а доступ может быть ограничен.</p>
<div class="npa"><span class="cap">Ключевая идея</span>Использование документов — это сервис, а не милость: архив обязан предоставлять информацию законным способом и в установленные сроки. От того, насколько качественно организовано использование, зависит авторитет архивной службы в обществе.</div>`}

intro:`<p>Эффективная архивная технология невозможна без грамотного управления: планирования, методического руководства, контроля, кадрового и финансового обеспечения. Лекция рассматривает систему управления архивным делом Республики Узбекистан, задачи Агентства «Узархив» и его территориальных органов, организацию работы архивного учреждения как хозяйствующего и бюджетного субъекта, а также вопросы кадров и материально-технического обеспечения.</p>`,
plan:[
"Система и функции государственного управления архивным делом в Республике Узбекистан",

],
sections:[
{t:"13.1. Система и функции государственного управления архивным делом", c:`<p>Управление архивным делом в Республике Узбекистан носит централизованный характер и осуществляется на двух уровнях: республиканском и территориальном.</p><p><strong>Кабинет Министров Республики Узбекистан</strong> определяет государственную политику в сфере архивного дела, утверждает положения и программы, распределяет полномочия между органами власти.</p><p><strong>Агентство «Узархив» Республики Узбекистан</strong> — центральный орган государственного управления, выполняющий функции:</p><ul>
<li>разработка и реализация государственной политики и программ развития архивного дела;</li>
<li>нормативно-методическое регулирование: правила, инструкции, типовые положения, перечни документов со сроками хранения;</li>
<li>координация деятельности государственных архивов и ведомственных архивов;</li>
<li>ведение Государственного каталога НАФ и государственного учёта документов;</li>
<li>контроль за соблюдением законодательства, за сохранностью документов НАФ, за организацией делопроизводства;</li>
<li>организация оцифровки, автоматизации и предоставления электронных услуг;</li>
<li>международное сотрудничество, научно-исследовательская и издательская деятельность;</li>
<li>подготовка предложений по совершенствованию законодательства.</li></ul>
<p><strong>Территориальный уровень</strong>: Совет Министров Республики Каракалпакстан, хокимияты областей и города Ташкента обеспечивают организацию архивного дела, содержание и финансирование территориальных архивов; действуют территориальные управления (отделы) Агентства «Узархив» и государственные архивы областей, районов и городов.</p>
<div class="npa"><span class="cap">Принцип централизации</span>Централизованная система управления обеспечивает единство методики, единообразие учёта и НСА на всей территории страны, что критически важно для сохранности и поиска документов Национального архивного фонда.</div>`},
{t:"13.2. Организация работы архивного учреждения: планирование, отчётность, хозяйственная деятельность", c:`<p>Государственный архив действует на основании положения, утверждаемого в установленном порядке, имеет структуру, штаты и внутренние правила. Основные направления внутренней организации:</p><ul>
<li><strong>планирование</strong> — перспективные (на 3–5 лет) и годовые планы работы по основным видам деятельности: комплектование, экспертиза, учёт, НСА, хранение, использование, автоматизация, научная работа;</li>
<li><strong>отчётность</strong> — статистическая (паспорт архива, отчёты о работе) и аналитическая (доклады о состоянии отрасли), представляемая в архивное ведомство;</li>
<li><strong>организационно-распорядительная деятельность</strong> — приказы, положения о подразделениях, должностные инструкции, правила внутреннего распорядка;</li>
<li><strong>финансово-хозяйственная деятельность</strong> — бюджетное финансирование, сметы расходов, материально-техническое снабжение, содержание зданий и оборудования, охрана;</li>
<li><strong>оказание платных услуг</strong> в порядке, установленном законодательством (изготовление копий, тематические подборки, реставрация, методические услуги), с учётом того, что основные государственные услуги предоставляются бесплатно;</li>
<li><strong>внутренний контроль качества</strong> — проверки наличия и состояния дел, методические совещания, рассмотрение споров и обращений.</li></ul>
<p>В структуре архива обычно выделяются: отдел комплектования и экспертизы ценности, отдел научно-справочного аппарата (каталогизации), отдел использования и публикации документов, отдел обеспечения сохранности и учётно-хранительский отдел, отдел автоматизации и оцифровки, отдел по личному составу, административно-хозяйственная часть.</p>`},
{t:"13.3. Методическое руководство и государственный контроль", c:`<p>Особенность управления архивным делом — сочетание методического руководства и государственного контроля за деятельностью организаций, не подчинённых архивам, но обязанных хранить документы.</p><p><strong>Формы методического руководства:</strong></p><ul>
<li>разработка и распространение методических пособий, инструкций, образцов документов;</li>
<li>проведение семинаров, курсов, консультаций для работников архивов и делопроизводственных служб;</li>
<li>согласование номенклатур дел, описей, положений о ведомственных архивах, инструкций по делопроизводству;</li>
<li>помощь в упорядочении документов и подготовке к передаче в государственные архивы;</li>
<li>развитие профессиональных связей, издание методических сборников.</li></ul>
<p><strong>Формы государственного контроля:</strong></p><ul>
<li>проверки (инспектирования) организаций в сфере архивного дела и делопроизводства;</li>
<li>контроль соблюдения сроков ведомственного хранения и качества подготовки документов;</li>
<li>контроль за сохранностью документов НАФ, в том числе у негосударственных владельцев;</li>
<li>принятие мер при выявлении нарушений: предписания, требования об устранении, привлечение к ответственности;</li>
<li>мониторинг состояния делопроизводства и архивов, подготовка аналитических материалов.</li></ul>
<div class="npa"><span class="cap">Значение контроля</span>Контроль направлен не на наказание, а на предотвращение утраты документов: своевременное выявление нарушений условий хранения, отсутствия описей, самовольного уничтожения позволяет спасти документальные комплексы.</div>`},
{t:"13.4. Кадровое обеспечение и материально-техническая база", c:`<p>Кадры — определяющий фактор качества архивной работы. Требования к специалистам включают: высшее (или среднее специальное) образование по направлению «История», «Архивоведение», «Документоведение и архивоведение»; знание законодательства, правил и методик; навыки работы с НСА, экспертизой ценности, оцифровкой; знание государственного и русского языков, желательно — восточных языков для работы с документами на арабской графике.</p><p>Система работы с кадрами:</p><ul>
<li>профессиональный отбор и аттестация;</li>
<li>повышение квалификации: курсы, семинары, стажировки, участие в конференциях;</li>
<li>должностные инструкции и распределение обязанностей;</li>
<li>оценка результатов труда, мотивация и поощрение;</li>
<li>преемственность поколений, наставничество, работа с молодыми специалистами.</li></ul>
<p><strong>Материально-техническая база</strong> включает: специально построенные или приспособленные здания архивов с изолированными хранилищами; стеллажи (стационарные и передвижные), шкафы, сейфы для особо ценных документов; системы вентиляции и кондиционирования, термогигрометры; средства пожаротушения и охранно-пожарной сигнализации; оборудование для оцифровки (сканеры, планетарные сканеры, фотостанции), серверы и системы резервного копирования; лаборатории реставрации и микрофильмирования; транспорт для перевозки документов.</p>
<div class="fact"><span class="cap">Управленческий вывод</span>Современное архивное учреждение — это одновременно научно-исследовательское, сервисное и обеспечивающее предприятие. Его эффективность определяется связкой: государственная политика — методика — кадры — инфраструктура — цифровые сервисы.</div>`}
],

intro:`<p>Обеспечение сохранности — первоочередная обязанность архивов и всех владельцев документов Национального архивного фонда. Утраченный документ не восстанавливается, поэтому вся технология хранения строится на предупреждении вредных воздействий и систематическом контроле. Лекция раскрывает факторы разрушения документов, требования к зданиям и оборудованию, режимы хранения, порядок проверки наличия и состояния дел, работу по реставрации и хранению электронных документов.</p>`,

sections:[
{t:"14.1. Понятие обеспечения сохранности и факторы, влияющие на состояние документов", c:`<p><strong>Обеспечение сохранности документов</strong> — комплекс организационных, технических, санитарно-гигиенических и правовых мер, направленных на защиту документов от разрушения, утраты и несанкционированного доступа, а также на сохранение их информационной ценности.</p><p><strong>Факторы, влияющие на сохранность:</strong></p><ul>
<li><strong>физико-химические</strong>: повышенная температура и влажность, перепады режима, действие света (особенно УФ-излучения), загрязнение воздуха (пыль, сернистые и азотистые соединения), качество бумаги и чернил (кислотная бумага, железо-галловые чернила, выцветание);</li>
<li><strong>биологические</strong>: плесневые грибы, бактерии, насекомые (точильщики, тараканы), грызуны — активизируются при влажности выше 60–65 % и плохой вентиляции;</li>
<li><strong>механические</strong>: перегибы, разрывы, износ при частом использовании, неплотная подшивка, неудобная обложка;</li>
<li><strong>техногенные и природные</strong>: пожар, затопление, аварии систем водоснабжения и отопления, землетрясение, теракт, военные действия;</li>
<li><strong>антропогенные</strong>: хищение, утрата при выдаче, небрежное обращение пользователей, самовольное уничтожение.</li></ul>
<div class="fact"><span class="cap">Физическая основа долговечности</span>Бумага ручного производства (в том числе самаркандская) более долговечна, чем кислотная бумага XX века: целлюлоза промышленного производства быстро разрушается под действием кислот. Поэтому документы XIX века нередко сохраняются лучше, чем документы 1950–1980-х годов.</div>`},
{t:"14.2. Здания, помещения и оборудование архивов; режимы хранения и топографирование", c:`<p>Архивохранилище — специально оборудованное помещение, отвечающее требованиям безопасности и стабильности среды. Основные требования: изолированность от производственных и бытовых помещений, отсутствие водопроводных и отопительных труб внутри хранилища, огнестойкие конструкции, автоматическая пожарная сигнализация и система пожаротушения, охранная сигнализация и контроль доступа, отсутствие окон либо светозащитные экраны.</p><p><strong>Режимы хранения:</strong></p><ul>
<li><strong>температурно-влажностный</strong>: для документов на бумажных носителях оптимальна температура 17–19 °C при относительной влажности 50–55 % (для фотодокументов и магнитных носителей — иные, более строгие параметры); контроль осуществляется термогигрометрами с ведением журналов;</li>
<li><strong>световой</strong>: исключение прямого солнечного света, защита от УФ-излучения, работа с документами при умеренной освещённости;</li>
<li><strong>санитарно-гигиенический</strong>: регулярная уборка, обеспыливание, дератизация и дезинсекция, запрет хранения посторонних предметов и пищи;</li>
<li><strong>охранный</strong>: контроль доступа, учёт выдачи, видеонаблюдение, опечатывание хранилищ, двухсменная выдача ключей.</li></ul>
<p><strong>Оборудование</strong>: стационарные и передвижные (компактные) стеллажи, шкафы и сейфы для особо ценных документов, боксы и папки из бескислотных материалов, футляры для фотодокументов и магнитных носителей, подъёмные механизмы, тележки.</p><p><strong>Топографирование</strong> — учёт места размещения единиц хранения в хранилище: каждой единице присваивается топографический указатель (стеллаж — шкаф — полка), ведутся топографические указатели и картотеки размещения, что обеспечивает быстрый поиск и контроль наличия. Размещение производится по фондам и описям в порядке нумерации, с учётом веса и состояния документов.</p>`},
{t:"14.3. Проверка наличия и состояния документов, реставрация и консервация", c:`<p><strong>Проверка наличия и состояния дел</strong> — обязательный элемент учёта, позволяющий обнаружить утраты и повреждения. Она проводится: в плановом порядке (циклично, по графику), при смене заведующего хранилищем, после перемещения фондов, после чрезвычайных ситуаций, при выдаче документов и по требованию архивного ведомства. По итогам составляется <strong>акт проверки наличия и состояния дел</strong>, а сведения вносятся в лист фонда и дело фонда.</p><p>При проверке фиксируются: отсутствие дел, наличие неучтённых и необнаруженных дел, повреждённые документы (разрывы, утрата листов, плесень, выцветание, осыпь чернил), неправильная нумерация, отсутствие внутренней описи.</p><p><strong>Меры по улучшению физического состояния:</strong></p><ul>
<li><strong>консервация</strong> — стабилизация состояния: обеспыливание, дезинфекция и дезинсекция, укрепление носителя, брошюровка;</li>
<li><strong>реставрация</strong> — восстановление повреждённых документов (укрепление листов, восполнение утрат, расшивка и переплёт), выполняемая специалистами в лабораториях;</li>
<li><strong>переплёт и подшивка</strong> — приведение дел в надлежащее состояние с сохранением читаемости;</li>
<li><strong>копирование</strong> — создание фонда пользования и страховых копий для защиты подлинников;</li>
<li><strong>фумигация и дезинфекция</strong> — при выявлении биологических поражений;</li>
<li><strong>особый режим</strong> для особо ценных и уникальных документов: отдельное хранение, ограничение выдачи, обязательное копирование.</li></ul>
<div class="npa"><span class="cap">Нормативное требование</span>Выдача пользователям подлинников документов с неудовлетворительным физическим состоянием не допускается — вместо них предоставляются копии, что защищает документ от дальнейшего разрушения.</div>`},
{t:"14.4. Хранение электронных документов, страховой фонд и действия в чрезвычайных ситуациях", c:`<p>Хранение электронных документов имеет особую специфику: разрушению подвергается не носитель, а доступность информации — из-за устаревания форматов, программного обеспечения и оборудования.</p><p>Требования к хранению электронных документов:</p><ul>
<li>фиксация формата файла, версии, метаданных и электронной цифровой подписи;</li>
<li>контроль целостности (контрольные суммы, хеширование) и проверка воспроизводимости;</li>
<li>миграция в актуальные форматы и эмуляция устаревших сред;</li>
<li>резервное копирование и хранение копий в географически удалённом месте;</li>
<li>разграничение подлинника электронного документа и электронного образа бумажного документа;</li>
<li>соблюдение правовых требований к доказательной силе и длительному хранению.</li></ul>
<p><strong>Страховой фонд копий</strong> создаётся для особо ценных документов и хранится отдельно от подлинников (в другом здании или регионе), обеспечивая восстановление информации при утрате оригиналов. <strong>Фонд пользования</strong> позволяет предоставлять пользователям копии вместо подлинников.</p>
<p><strong>Действия в чрезвычайных ситуациях</strong> регламентируются планами: оповещение, эвакуация и спасение документов, просушка и дезинфекция затопленных материалов, фиксация утрат актами, восстановление по страховым копиям, информирование архивного ведомства. Важна профилактика: исправность систем, обучение персонала, наличие средств пожаротушения, регулярные тренировки.</p>
<div class="fact"><span class="cap">Принцип приоритета</span>Сохранность документов Национального архивного фонда — обязанность всех физических и юридических лиц. Ни экономическая целесообразность, ни нехватка площадей не могут служить основанием для уничтожения документов без законной процедуры.</div>`}
],

intro:`<p>Археография — дисциплина, соединяющая архивоведение, источниковедение и издательское дело: она разрабатывает правила выявления, отбора, передачи и научной публикации исторических источников. Публикация документов делает архивное наследие доступным обществу, вводит его в научный оборот и образовательный процесс. Лекция раскрывает предмет и задачи археографии, методику отбора и передачи текста документов, структуру научных изданий, а также практику публикации документов в Республике Узбекистан.</p>`,
plan:[
"Понятие, предмет и задачи археографии; виды публикаций исторических источников",

sections:[
{t:"15.1. Понятие, предмет и задачи археографии; виды публикаций", c:`<p><strong>Археография</strong> — научная дисциплина, изучающая историю, теорию и методику выявления, отбора, передачи и публикации исторических источников, а также разрабатывающая правила подготовки научных изданий документов.</p><p><strong>Предмет археографии</strong> — публикация документов как особый вид научной работы, связанный с подготовкой текста источника к изданию; <strong>задачи</strong> — обеспечение научной точности воспроизведения документа, доступности источника для исследования, единообразия издательской практики.</p><p>Археография связана с архивоведением (археограф работает с фондами, описями и каталогами), с источниковедением (критика источника, определение его достоверности и информационного потенциала), с текстологией, палеографией, историей языка, с издательским делом.</p><p><strong>Виды публикаций:</strong></p><ul>
<li><strong>по способу воспроизведения</strong>: дипломатическая (точная, построчная передача с сохранением особенностей текста), упрощённо-палеографическая, краткая (по правилам современной орфографии с сохранением лексики), факсимильная (точное воспроизведение вида документа);</li>
<li><strong>по составу</strong>: полная публикация документа, извлечение (выписка), аннотированная публикация;</li>
<li><strong>по охвату</strong>: публикация одного документа, документального комплекса (фонда), тематический сборник;</li>
<li><strong>по назначению</strong>: научное издание, научно-популярное издание, учебное издание, публикация в средствах массовой информации, электронная публикация (веб-порталы, цифровые коллекции).</li></ul>
<div class="fact"><span class="cap">Значение публикаций</span>Публикация документов позволяет сохранить ценную информацию в случае утраты оригинала, расширить доступ исследователей и студентов к первоисточникам и сделать историю общества наглядной и доказательной.</div>`},
{t:"15.2. Выявление, отбор и подготовка документов к публикации", c:`<p>Подготовка научного издания начинается с разработки <strong>темы</strong> и <strong>научной концепции</strong> издания, определения хронологических рамок, круга фондов и архивов, в том числе зарубежных.</p><p><strong>Этапы работы:</strong></p><ul>
<li><strong>выявление источников</strong> — сплошной или выборочный просмотр фондов, описей, каталогов, опубликованных источников, периодики; фиксация выявленных документов в картотеке (базе данных) выявления;</li>
<li><strong>отбор документов</strong> — по критериям: значимость, информативность, репрезентативность, полнота, подлинность; исключение дублирующих документов;</li>
<li><strong>источниковедческая критика</strong> — установление подлинности, авторства, времени и места создания документа, его цели и достоверности;</li>
<li><strong>установление текста</strong> — выбор основного текста (подлинника или заверенной копии), сопоставление редакций и вариантов;</li>
<li><strong>подготовка научно-справочного аппарата</strong> — вступительная статья, примечания, указатели, список сокращений, перечень документов;</li>
<li><strong>редактирование и согласование</strong> — научно-редакционная коллегия, рецензирование, утверждение издания.</li></ul>
<p>При отборе документов для публикации археограф обязан указывать архивный шифр каждого документа, соблюдать требования законодательства об архивах и охраняемых законом сведениях (персональные данные, государственная тайна), согласовывать публикации с архивом-владельцем документов.</p>
<div class="npa"><span class="cap">Правила доступа</span>Публикация документов, содержащих персональные данные и иные охраняемые законом сведения, требует соблюдения законодательства Республики Узбекистан; для документов с ограниченным доступом необходимо разрешение владельца и уполномоченных органов.</div>`},
{t:"15.3. Правила передачи текста документа и оформление примечаний", c:`<p>Центральная задача археографии — передать текст документа так, чтобы сохранить его достоверность и обеспечить читаемость. Основные правила:</p><ul>
<li><strong>передача текста</strong> зависит от типа издания: дипломатическая передача сохраняет орфографию и особенности написания; упрощённая — воспроизводит текст современными буквами с сохранением лексики и синтаксиса; краткая — переводит текст на современную орфографию;</li>
<li><strong>расшифровка сокращений</strong> — расшифрованные части заключаются в квадратные скобки;</li>
<li><strong>обозначение утрат и нечитаемых мест</strong> — в квадратных скобках с многоточием или специальными знаками;</li>
<li><strong>вставки и исправления</strong> — текст, вписанный автором сверх строки или между строк, помечается условными знаками;</li>
<li><strong>транслитерация</strong> — передача документов на арабской графике латиницей или кириллицей по принятой системе с указанием применённой системы транслитерации;</li>
<li><strong>перевод</strong> — при публикации документов на иностранных языках даётся перевод с параллельным приведением оригинала либо с указанием на его наличие в архиве;</li>
<li><strong>датировка</strong> — установление даты документа; при отсутствии даты она определяется по косвенным данным и указывается в квадратных скобках со знаком вопроса; при необходимости приводится двойная датировка (по мусульманскому календарю хиджры и по григорианскому);</li>
<li><strong>примечания</strong> — археографические (об особенностях текста, исправлениях, вариантах) и историко-текстологические (пояснения имён, терминов, событий);</li>
<li><strong>легенда</strong> — сведения о каждом документе: наименование архивохранилища, номер фонда, описи, дела, листов, вид документа, степень подлинности, язык, способ воспроизведения, сведения о публикации.</li></ul>
<div class="npa"><span class="cap">Принцип научной добросовестности</span>Любые изменения текста должны быть оговорены; недопустимы произвольные сокращения, изъятия и редакционные правки без обозначения — иначе документ перестаёт быть источником и становится интерпретацией.</div>`},
{t:"15.4. Структура научного издания и практика публикации документов в Узбекистане", c:`<p><strong>Структура научного издания документов</strong> включает:</p><ul>
<li>титульные данные и сведения об издании;</li>
<li>вступительную статью (историография, характеристика источников, методика издания);</li>

<li>справочный аппарат: список сокращений, перечень документов, именной, географический, предметный указатели, хронологический перечень;</li>
<li>список использованных архивов и фондов, список литературы;</li>
<li>сведения о научно-редакционной коллегии, составителях и рецензентах.</li></ul>
<p>В Республике Узбекистан публикуются тематические сборники документов по истории независимости, деятельности государственных органов, истории народного образования, науки и культуры, ирригации, промышленности, событиям военного времени, а также документы по истории Бухарского эмирата, Хивинского и Кокандского ханств, материалы Темуридов. Издания готовятся Агентством «Узархив» совместно с Национальным архивом Узбекистана, центральными государственными архивами, научными учреждениями и вузами; значительная часть документов публикуется также в электронном виде на архивных порталах, что расширяет доступ исследователей и студентов.</p>
<p><strong>Перспективные направления археографии:</strong> создание электронных изданий с поисковыми возможностями и оригинальными изображениями документов; подготовка двуязычных и трёхязычных изданий; включение документального наследия Узбекистана в международные научные проекты; использование цифровых технологий для верификации текстов и автоматического распознавания рукописей (OCR/HTR).</p>
<div class="fact"><span class="cap">Итог курса</span>Архивоведение охватывает весь цикл работы с документами: от их создания в делопроизводстве до научной публикации. Знание этой технологии делает специалиста способным обеспечить сохранность документального наследия Узбекистана и сделать его доступным обществу.</div>`}

terms:[

{t:"Археографическое примечание", d:"Примечание издателя об особенностях текста, сокращениях, утратах, вариантах и исправлениях."},
{t:"Вступительная статья", d:"Часть научного издания, характеризующая тему, источники, методику подготовки издания и его научно-справочный аппарат."},
{t:"Научно-редакционная коллегия", d:"Орган, утверждающий концепцию издания, отбор документов и качество археографической подготовки."}

"Виды публикаций различаются по способу передачи текста (дипломатическая, упрощённая, краткая, факсимильная), составу и назначению.",
