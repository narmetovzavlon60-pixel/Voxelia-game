<script>
(function(){
"use strict";
/* ---------- Telegram SDK ---------- */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

/* ---------- Хранилище ---------- */
const K = {p:"arh_uz_progress_v1", s:"arh_uz_set_v1", l:"arh_uz_last_v1"};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let progress = load(K.p,{});
let set = Object.assign({fs:17, collapse:false, auto:false, haptic:true}, load(K.s,{}));
let lastId = load(K.l,null);
let tab="catalog", cur=null, openSec={}, IDX=null;

const view = document.getElementById("view");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function stripTags(s){return String(s).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
function num(n){return n<10?"0"+n:""+n;}
function haptic(kind){
  if(!set.haptic||!tg||!tg.HapticFeedback) return;
  try{
    if(kind==="ok") tg.HapticFeedback.notificationOccurred("success");
    else if(kind==="warn") tg.HapticFeedback.notificationOccurred("warning");
    else tg.HapticFeedback.impactOccurred("light");
  }catch(e){}
}
function saveSet(){save(K.s,set); document.documentElement.style.setProperty("--fs", set.fs+"px");}

/* ---------- Тема ---------- */
function lum(hex){
  if(typeof hex!=="string"||hex[0]!=="#") return 1;
  let h=hex.slice(1); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const r=parseInt(h.substr(0,2),16)||0,g=parseInt(h.substr(2,2),16)||0,b=parseInt(h.substr(4,2),16)||0;
  return (0.299*r+0.587*g+0.114*b)/255;
}
function applyTheme(){
  const r=document.documentElement;
  if(!tg){
    r.dataset.scheme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark":"light";
    return;
  }
  const t=tg.themeParams||{};
  const map={bg_color:"--bg", text_color:"--text", hint_color:"--hint", link_color:"--link",
             button_color:"--btn", button_text_color:"--btntxt", secondary_bg_color:"--sec"};
  Object.keys(map).forEach(k=>{ if(t[k]) r.style.setProperty(map[k], t[k]); });
  if(t.link_color) r.style.setProperty("--accent", t.link_color);
  r.dataset.scheme = lum(t.bg_color||"#ffffff") < 0.5 ? "dark":"light";
  try{ tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); }catch(e){}
}

/* ---------- Поисковый индекс ---------- */
function index(){
  if(IDX) return IDX;
  IDX=[];
  LECTURES.forEach(l=>{
    IDX.push({t:"Лекция "+num(l.id), lid:l.id, sid:-1, ti:l.title, tx:stripTags(l.intro)+" "+l.tags.join(" ")});
    l.sections.forEach((s,i)=>IDX.push({t:"Раздел · лекция "+num(l.id), lid:l.id, sid:i, ti:s.t, tx:stripTags(s.c)}));
    l.terms.forEach(tr=>IDX.push({t:"Термин · лекция "+num(l.id), lid:l.id, sid:-2, ti:tr.t, tx:tr.d}));
    l.summary.forEach(s=>IDX.push({t:"Вывод · лекция "+num(l.id), lid:l.id, sid:-4, ti:s, tx:l.title}));
    l.questions.forEach(q=>IDX.push({t:"Вопрос · лекция "+num(l.id), lid:l.id, sid:-3, ti:q, tx:l.title}));
  });
  return IDX;
}
function rx(q){ return q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function hl(text,q){
  const t=esc(String(text));
  if(!q) return t;
  try{ return t.replace(new RegExp(rx(q),"gi"), function(m){return "<mark>"+m+"</mark>";}); }catch(e){ return t; }
}
function doSearch(q){
  q=(q||"").toLowerCase().trim();
  if(q.length<2) return [];
  const out=[];
  index().forEach(e=>{
    const ti=e.ti.toLowerCase(), tx=e.tx.toLowerCase();
    let sc=0, pos=-1;
    if(ti.indexOf(q)>=0){ sc=120+Math.max(0,24-q.length); pos=ti.indexOf(q); }
    else if(tx.indexOf(q)>=0){ sc=45; pos=tx.indexOf(q); }
    if(sc) out.push({e:e, sc:sc, pos:pos});
  });
  out.sort(function(a,b){return b.sc-a.sc;});
  return out.slice(0,40);
}
function snippet(text,q){
  const tx=stripTags(text), i=tx.toLowerCase().indexOf(q);
  if(i<0) return hl(tx.slice(0,120),q);
  const s=Math.max(0,i-70), e=Math.min(tx.length,i+140);
  return (s>0?"…":"")+hl(tx.slice(s,e),q)+(e<tx.length?"…":"");
}

/* ---------- Отрисовка ---------- */
function updStrip(){
  const done=LECTURES.filter(l=>progress[l.id]).length;
  document.getElementById("pBar").style.width = (done/LECTURES.length*100)+"%";
  document.getElementById("pNum").textContent = done;
  document.getElementById("subTitle").textContent = "15 лекций · 30 ч. · изучено "+done+" из "+LECTURES.length;
}
function row(l){
  const read=!!progress[l.id];
  return '<div class="row" data-open="'+l.id+'"><div class="num'+(read?" done":"")+'">'+num(l.id)+'</div><div class="rw"><h3>'+esc(l.title)+'</h3><p>'+esc(l.tags.slice(0,3).join(" · "))+'</p></div>'+
    (read?'<span class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>':'<span class="badge">'+l.hours+' ч.</span>')+'</div>';
}
function renderCatalog(){
  let h="";
  if(!tg) h+='<div class="pv-banner">Режим предпросмотра: страница открыта вне Telegram Mini App. Все функции (поиск, навигация, прогресс) работают локально в этом браузере.</div>';
  const first = LECTURES.find(l=>!progress[l.id]) || LECTURES[0];
  if(lastId && LECTURES.some(l=>l.id===lastId)){
    const l=LECTURES.find(x=>x.id===lastId);
    h+='<div class="head-cta"><div class="ct">Продолжить: лекция '+num(l.id)+'</div><div class="cs">'+esc(l.title)+' · '+(progress[l.id]?"уже изучена":"ещё не отмечена")+'</div>'+
       '<div class="tagrow"><button class="chip" data-open="'+l.id+'">Открыть лекцию '+num(l.id)+'</button><button class="chip gray" data-open="'+first.id+'">Следующая к изучению</button></div></div>';
  }
  const mods=[];
  LECTURES.forEach(l=>{ if(mods.indexOf(l.module)<0) mods.push(l.module); });
  mods.forEach(m=>{
    const g=LECTURES.filter(l=>l.module===m);
    const d=g.filter(l=>progress[l.id]).length;
    h+='<div class="ghead">'+esc(m)+' · '+d+"/"+g.length+'</div><div class="list">'+g.map(row).join("")+'</div>';
  });
  h+='<div class="card"><div class="note">Дисциплина «Архивоведение»: 15 лекций (30 часов). Материал построен на законодательстве Республики Узбекистан об архивах, истории архивного дела и практике Агентства «Узархив». Прогресс изучения сохраняется на устройстве.</div></div>';
  view.innerHTML=h;
}
function isOpen(l,i){
  const k=l.id+"-"+i;
  if(openSec[k]===undefined) return set.collapse ? false : (i===0);
  return openSec[k];
}
function renderReader(id){
  const l=LECTURES.find(x=>x.id===id); if(!l){ tab="catalog"; renderCatalog(); return; }
  const idx=LECTURES.indexOf(l), read=!!progress[id];
  let h='<article><div class="hero"><div class="chips"><span class="chip">Лекция '+num(l.id)+'</span><span class="chip gray">'+l.hours+' ч.</span>'+
        (read?'<span class="chip green">Изучено</span>':'<span class="chip amber">В процессе</span>')+'</div>'+
        '<h2>'+esc(l.title)+'</h2><div class="meta">'+esc(l.module)+'<br>'+esc(l.tags.join(" · "))+'</div></div>';
  h+='<section class="card"><h2>Введение</h2><div class="prose">'+l.intro+'</div></section>';
  h+='<section class="card"><h2>План лекции</h2><ol class="plan">'+l.plan.map(p=>"<li>"+esc(p)+"</li>").join("")+'</ol></section>';
  const allOpen = l.sections.every(function(s,i){return isOpen(l,i);});
  h+='<section class="card"><div class="h-row"><h2>Содержание лекции</h2><button class="mini" id="btnAll">'+(allOpen?"Свернуть всё":"Развернуть всё")+'</button></div>';
  l.sections.forEach(function(s,i){
    h+='<div class="acc'+(isOpen(l,i)?" open":"")+'" id="sec-'+id+'-'+i+'"><button class="acc-h" data-acc="'+i+'"><span class="t">'+esc(s.t)+'</span><span class="ar"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></button><div class="acc-b"><div class="prose">'+s.c+'</div></div></div>';
  });
  h+='</section>';
  h+='<section class="card" id="terms-'+id+'"><h2>Ключевые термины и определения</h2><dl class="terms">'+
     l.terms.map(t=>"<dt>"+esc(t.t)+"</dt><dd>"+esc(t.d)+"</dd>").join("")+'</dl></section>';
  h+='<section class="card" id="sum-'+id+'"><h2>Краткие выводы</h2><ul class="sum">'+l.summary.map(s=>"<li>"+esc(s)+"</li>").join("")+'</ul></section>';
  h+='<section class="card" id="q-'+id+'"><h2>Вопросы для самоконтроля</h2><ol class="q">'+l.questions.map(q=>"<li>"+esc(q)+"</li>").join("")+'</ol></section>';
  h+='<div class="readbar"><button class="btn'+(read?" ghost":"")+'" data-mark="'+id+'">'+(read?"Отменить отметку":"Отметить изученной")+'</button></div>';
  const prev=LECTURES[idx-1], nx=LECTURES[idx+1];
  h+='<nav class="nav2">'+(prev?'<button data-open="'+prev.id+'"><div class="lbl">← Предыдущая</div><div class="ttl">'+esc(prev.title)+'</div></button>':'<div></div>')+
     (nx?'<button class="nx" data-open="'+nx.id+'"><div class="lbl">Следующая →</div><div class="ttl">'+esc(nx.title)+'</div></button>':'<div></div>')+'</nav></article>';
  view.innerHTML=h;
}
function paintGlossary(q){
  q=(q||"").toLowerCase().trim();
  let n=0, h="";
  LECTURES.forEach(l=>{
    const terms=l.terms.filter(t=>!q || (t.t+" "+t.d).toLowerCase().indexOf(q)>=0);
    if(!terms.length) return;
    h+='<div class="ghead">Лекция '+num(l.id)+'. '+esc(l.title)+'</div><div class="card">'+terms.map(function(t){
      n++;
      return '<div style="margin-bottom:13px"><div style="font-weight:650;color:var(--accent);font-size:calc(var(--fs) - .5px)">'+hl(t.t,q)+'</div><div class="prose" style="font-size:calc(var(--fs) - 1px);margin-top:3px">'+hl(t.d,q)+'</div></div>';
    }).join("")+'</div>';
  });
  if(!n) h+='<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg><div>Ничего не найдено</div></div>';
  else h+='<div class="card"><div class="note">Всего терминов в глоссарии курса: '+n+'</div></div>';
  const el=document.getElementById("glist"); if(el) el.innerHTML=h;
}
function renderGlossary(){
  view.innerHTML='<div class="searchwrap"><input class="inp" id="gq" placeholder="Поиск термина или определения…"></div><div id="glist"></div>';
  paintGlossary("");
  const inp=document.getElementById("gq");
  inp.addEventListener("input", function(e){ paintGlossary(e.target.value); });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },150);
}
function renderProgress(){
  const total=LECTURES.length, doneList=LECTURES.filter(l=>progress[l.id]), done=doneList.length;
  const pct=Math.round(done/total*100), hrs=doneList.reduce(function(a,l){return a+l.hours;},0);
  const terms=LECTURES.reduce(function(a,l){return a+l.terms.length;},0);
  const secs=LECTURES.reduce(function(a,l){return a+l.sections.length;},0);
  const C=2*Math.PI*40;
  let h='<div class="card"><h2>Общий прогресс</h2><div class="ring"><div class="rr">'+
    '<svg width="92" height="92"><circle cx="46" cy="46" r="40" stroke="rgba(120,120,128,.22)" stroke-width="9" fill="none"/>'+
    '<circle cx="46" cy="46" r="40" stroke="var(--accent)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-done/total)).toFixed(1)+'"/></svg>'+
    '<div class="pct">'+pct+'%</div></div><div class="stat">'+
    '<div class="it"><span>Лекций изучено</span><b>'+done+' из '+total+'</b></div>'+
    '<div class="it"><span>Часов освоено</span><b>'+hrs+' из 30</b></div>'+
    '<div class="it"><span>Разделов лекций в курсе</span><b>'+secs+'</b></div>'+
    '<div class="it"><span>Терминов в глоссарии</span><b>'+terms+'</b></div>'+
    '<div class="it"><span>Прогресс сохранён</span><b>на устройстве</b></div></div></div></div>';
  h+='<div class="ghead">Состояние по лекциям</div><div class="list">';
  LECTURES.forEach(l=>{
    const r=!!progress[l.id];
    h+='<div class="row" data-open="'+l.id+'"><div class="num'+(r?" done":"")+'">'+num(l.id)+'</div><div class="rw"><h3>'+esc(l.title)+'</h3><p>'+esc(l.module)+'</p></div>'+
       (r?'<span class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>':'<span class="badge">'+l.hours+' ч.</span>')+'</div>';
  });
  h+='</div><div class="readbar"><button class="btn ghost" id="btnReset">Сбросить прогресс</button></div>';
  view.innerHTML=h;
}
function renderSettings(){
  const sizes=[["S",15],["M",16],["L",17],["XL",19]];
  let h='<div class="card"><h2>Размер текста</h2><div class="fsz">'+sizes.map(s=>'<button data-fs="'+s[1]+'" class="'+(set.fs===s[1]?"on":"")+'">'+s[0]+'</button>').join("")+'</div>'+
        '<div class="note" style="margin-top:10px">Размер применяется ко всему учебному материалу.</div></div>';
  h+='<div class="card tight"><div class="setrow"><div class="t"><b>Свёрнутые разделы</b><span>Открывать содержание лекции только по нажатию</span></div><div class="sw'+(set.collapse?" on":"")+'" data-tg="collapse"></div></div>'+
     '<div class="setrow"><div class="t"><b>Автоотметка изучения</b><span>Лекция отмечается автоматически при прокрутке до конца</span></div><div class="sw'+(set.auto?" on":"")+'" data-tg="auto"></div></div>'+
     '<div class="setrow"><div class="t"><b>Тактильный отклик</b><span>Вибрация при навигации и отметках (в Telegram)</span></div><div class="sw'+(set.haptic?" on":"")+'" data-tg="haptic"></div></div></div>';
  h+='<div class="card"><h2>О дисциплине</h2><div class="note">«Архивоведение» — 15 лекций (30 часов). Содержание: предмет и задачи архивоведения, история архивного дела, классификация документов Национального архивного фонда Республики Узбекистан, архивное дело независимого Узбекистана, экспертиза ценности и приём документов, научно-справочный аппарат, использование документов, управление архивными учреждениями, хранение документов, археография.</div>'+
     '<div class="tagrow"><span class="tag">Закон РУз «Об архивах» (1999)</span><span class="tag">Закон «Об архивном деле» (2010)</span><span class="tag">Агентство «Узархив»</span><span class="tag">НАФ РУз</span></div></div>';
  h+='<div class="readbar"><button class="btn ghost" id="btnReset2">Сбросить весь прогресс</button></div>'+
     '<div class="card"><div class="note">Приложение работает офлайн: весь учебный материал встроен в файл, внешняя зависимость — только Telegram Web App SDK. Прогресс и настройки хранятся в localStorage устройства.</div></div>';
  view.innerHTML=h;
}
function render(){
  document.querySelectorAll("#tabbar button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab===tab); });
  if(tab==="catalog") renderCatalog();
  else if(tab==="reader") renderReader(cur);
  else if(tab==="glossary") renderGlossary();
  else if(tab==="progress") renderProgress();
  else renderSettings();
}
function go(t,id){
  tab=t; cur=(t==="reader")?id:null;
  if(t==="reader"){ lastId=id; save(K.l,id); }
  render(); window.scrollTo(0,0); closeDrawer(); closeSearch(); updStrip(); syncTG();
}

/* ---------- Действия ---------- */
function mark(id){
  const y=window.scrollY;
  if(progress[id]) delete progress[id]; else progress[id]=true;
  save(K.p,progress); haptic(progress[id]?"ok":"warn");
  renderReader(id); window.scrollTo(0,y); updStrip(); syncTG();
  renderDrawer();
}
function toggleAcc(id,i){
  const el=document.getElementById("sec-"+id+"-"+i); if(!el) return;
  const on=!el.classList.contains("open");
  el.classList.toggle("open",on); openSec[id+"-"+i]=on; haptic();
}
function toggleAll(){
  const l=LECTURES.find(x=>x.id===cur); if(!l) return;
  const open = !l.sections.every(function(s,i){return isOpen(l,i);});
  l.sections.forEach(function(s,i){ openSec[l.id+"-"+i]=open; const el=document.getElementById("sec-"+l.id+"-"+i); if(el) el.classList.toggle("open",open); });
  haptic();
  const b=document.getElementById("btnAll"); if(b) b.textContent = open?"Свернуть всё":"Развернуть всё";
}
function resetProgress(){
  if(tg && tg.showConfirm){
    try{ tg.showConfirm("Сбросить весь прогресс изучения курса?", function(ok){ if(ok) doReset(); }); return; }catch(e){}
  }
  if(confirm("Сбросить весь прогресс изучения курса?")) doReset();
}
function doReset(){
  progress={}; save(K.p,progress); lastId=null; save(K.l,null);
  updStrip(); renderDrawer(); render(); syncTG(); haptic("warn");
}

/* ---------- Drawer / Поиск ---------- */
function renderDrawer(){
  const total=LECTURES.length, done=LECTURES.filter(l=>progress[l.id]).length;
  let h='<div class="d-head"><span class="chip">Архивоведение</span><h3>Содержание курса</h3><p>15 лекций · 30 часов · изучено '+done+' из '+total+'</p></div><div class="d-scroll">';
  h+='<button class="d-row" data-tab="catalog"><div class="n">◆</div><div class="t"><b>Все лекции</b><span>Список по модулям</span></div></button>';
  LECTURES.forEach(function(l){
    const r=!!progress[l.id];
    h+='<button class="d-row" data-open="'+l.id+'"><div class="n'+(r?" done":"")+'">'+(r?"✓":num(l.id))+'</div><div class="t"><b>'+esc(l.title)+'</b><span>'+l.hours+' ч. · '+esc(l.tags[0]||"")+'</span></div></button>';
  });
  h+='<div class="d-sec">Разделы</div>';
  h+='<button class="d-row" data-tab="glossary"><div class="n">Г</div><div class="t"><b>Глоссарий</b><span>Все термины курса</span></div></button>';
  h+='<button class="d-row" data-tab="progress"><div class="n">П</div><div class="t"><b>Мой прогресс</b><span>'+done+' из '+total+' лекций</span></div></button>';
  h+='<button class="d-row" data-tab="settings"><div class="n">⚙</div><div class="t"><b>Настройки</b><span>Шрифт, отметки, сброс</span></div></button></div>';
  document.getElementById("drawer").innerHTML=h;
}
function openDrawer(){ renderDrawer(); document.getElementById("drawer").classList.add("on"); document.getElementById("ovl").classList.add("on"); haptic(); }
function closeDrawer(){ document.getElementById("drawer").classList.remove("on"); document.getElementById("ovl").classList.remove("on"); }
function openSearch(){
  const sh=document.getElementById("searchSheet");
  sh.innerHTML='<div class="s-head"><input class="inp" id="sq" placeholder="Поиск по лекциям, разделам, терминам…"><button class="mini" id="sClose">Готово</button></div><div class="s-body" id="sres"></div>';
  sh.classList.add("on"); haptic();
  const inp=document.getElementById("sq"), res=document.getElementById("sres");
  function paint(q){
    q=(q||"").toLowerCase().trim();
    if(q.length<2){ res.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg><div>Введите не менее двух символов.<br>Поиск ведётся по названиям, разделам, терминам,<br>выводам и вопросам всех 15 лекций.</div></div>'; return; }
    const r=doSearch(q);
    if(!r.length){ res.innerHTML='<div class="empty"><div>Ничего не найдено</div></div>'; return; }
    res.innerHTML=r.map(function(o){
      const e=o.e;
      return '<div class="res" data-open="'+e.lid+'" data-sid="'+e.sid+'"><div class="k">'+esc(e.t)+'</div><b>'+hl(e.ti,q)+'</b><p>'+snippet(e.tx,q)+'</p></div>';
    }).join("");
  }
  paint("");
  inp.addEventListener("input", function(e){ paint(e.target.value); });
  document.getElementById("sClose").addEventListener("click", closeSearch);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },200);
}
function closeSearch(){ const sh=document.getElementById("searchSheet"); if(sh) sh.classList.remove("on"); }
function jumpTo(lid,sid){
  tab="reader"; cur=lid; lastId=lid; save(K.l,lid);
  document.querySelectorAll("#tabbar button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab==="reader"); });
  renderReader(lid); closeSearch(); closeDrawer(); updStrip(); syncTG();
  setTimeout(function(){
    if(sid>=0){
      openSec[lid+"-"+sid]=true;
      const el=document.getElementById("sec-"+lid+"-"+sid);
      if(el) el.classList.add("open");
    }
    const target = sid>=0 ? document.getElementById("sec-"+lid+"-"+sid)
                 : sid===-2 ? document.getElementById("terms-"+lid)
                 : sid===-3 ? document.getElementById("q-"+lid)
                 : sid===-4 ? document.getElementById("sum-"+lid) : null;
    if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
  },80);
}

/* ---------- Telegram Main / Back ---------- */
function syncTG(){
  if(!tg) return;
  try{
    if(tg.BackButton){
      if(cur!=null || tab==="glossary" || tab==="progress" || tab==="settings") tg.BackButton.show();
      else tg.BackButton.hide();
    }
  }catch(e){}
  try{
    if(tg.MainButton){
      if(cur!=null){
        const read=!!progress[cur], nx=LECTURES.find(l=>l.id===cur+1);
        tg.MainButton.setText(read ? (nx ? "Следующая лекция →" : "В содержание") : "Отметить изученной");
        tg.MainButton.show();
      } else tg.MainButton.hide();
    }
  }catch(e){}
}
function onMain(){
  if(cur==null) return;
  if(!progress[cur]){ progress[cur]=true; save(K.p,progress); haptic("ok"); updStrip(); renderDrawer(); }
  const nx=LECTURES.find(l=>l.id===cur+1);
  haptic(); if(nx) go("reader",nx.id); else go("catalog");
}
function onBack(){
  if(document.getElementById("searchSheet").classList.contains("on")){ closeSearch(); return; }
  if(document.getElementById("drawer").classList.contains("on")){ closeDrawer(); return; }
  if(cur!=null){ go("catalog"); return; }
  go("catalog");
}

/* ---------- События ---------- */
document.getElementById("btnMenu").addEventListener("click", openDrawer);
document.getElementById("btnSearch").addEventListener("click", openSearch);
document.getElementById("ovl").addEventListener("click", closeDrawer);
document.getElementById("toTop").addEventListener("click", function(){ window.scrollTo({top:0,behavior:"smooth"}); });
document.getElementById("tabbar").addEventListener("click", function(e){
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  go(b.dataset.tab);
});
document.addEventListener("click", function(e){
  const acc=e.target.closest("[data-acc]");
  if(acc){ toggleAcc(cur, parseInt(acc.dataset.acc,10)); return; }
  if(e.target.closest("#btnAll")){ toggleAll(); return; }
  const mk=e.target.closest("[data-mark]");
  if(mk){ mark(parseInt(mk.dataset.mark,10)); return; }
  if(e.target.closest("#btnReset")||e.target.closest("#btnReset2")){ resetProgress(); return; }
  const fs=e.target.closest("[data-fs]");
  if(fs){ set.fs=parseInt(fs.dataset.fs,10); saveSet(); haptic(); renderSettings(); return; }
  const tg2=e.target.closest("[data-tg]");
  if(tg2){ const k=tg2.dataset.tg; set[k]=!set[k]; saveSet(); tg2.classList.toggle("on",set[k]); haptic(); if(k==="collapse" && cur!=null) renderReader(cur); return; }
  const op=e.target.closest("[data-open]");
  if(op){ haptic(); jumpTo(parseInt(op.dataset.open,10), parseInt(op.dataset.sid||-1,10)); return; }
});
window.addEventListener("scroll", function(){
  const t=document.getElementById("toTop");
  if(t) t.classList.toggle("on", window.scrollY>420);
  if(set.auto && tab==="reader" && cur!=null && !progress[cur]){
    if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 140){
      progress[cur]=true; save(K.p,progress); updStrip(); haptic("ok");
      const b=document.querySelector("[data-mark]"); if(b) b.textContent="Отменить отметку";
    }
  }
}, {passive:true});
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeSearch(); closeDrawer(); } });

/* ---------- Инициализация ---------- */
applyTheme(); saveSet(); renderDrawer(); render(); updStrip(); syncTG();
if(tg){
  try{ tg.ready(); tg.expand(); }catch(e){}
  try{ if(tg.enableClosingConfirmation) tg.enableClosingConfirmation(); }catch(e){}
  try{ tg.onEvent("themeChanged", applyTheme); }catch(e){}
  try{ if(tg.MainButton) tg.MainButton.onClick(onMain); }catch(e){}
  try{ if(tg.BackButton) tg.BackButton.onClick(onBack); }catch(e){}
} else {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
}
})();
</script>
</body>
</html>
